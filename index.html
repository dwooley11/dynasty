<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dynasty League Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7fb;
  --bg-2: #ffffff;
  --bg-3: #f0f2f7;
  --line: #e4e7ee;
  --line-2: #eef0f5;
  --ink: #1a1d23;
  --ink-2: #5b6271;
  --ink-3: #98a0ad;

  --pos-qb: #10b981;
  --pos-qb-bg: #d6f5e8;
  --pos-rb: #3b82f6;
  --pos-rb-bg: #d8e6fb;
  --pos-wr: #ec4899;
  --pos-wr-bg: #fbdcea;
  --pos-te: #a855f7;
  --pos-te-bg: #ecddfb;
  --pos-pk: #f59e0b;
  --pos-pk-bg: #fcedcf;

  --rank-good: #d3f5dc;
  --rank-good-ink: #117a3a;
  --rank-mid:  #fdf3cf;
  --rank-mid-ink:  #8a6b13;
  --rank-bad:  #fbdada;
  --rank-bad-ink:  #a02828;

  --shadow-sm: 0 1px 2px rgba(20,25,40,0.04), 0 1px 1px rgba(20,25,40,0.03);
  --shadow-md: 0 4px 14px rgba(20,25,40,0.06), 0 1px 3px rgba(20,25,40,0.04);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.dd-root { padding: 28px 36px; max-width: 1600px; margin: 0 auto; }

.dd-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding-bottom: 22px; margin-bottom: 24px;
  gap: 16px; flex-wrap: wrap;
}
.dd-brand { display: flex; align-items: center; gap: 14px; }
.dd-brand-mark {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  display: grid; place-items: center;
  font-size: 26px; color: #fff; border-radius: 14px;
  box-shadow: var(--shadow-md);
}
.dd-brand-title {
  font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
}
.dd-brand-sub {
  font-size: 13px; color: var(--ink-2);
  margin-top: 4px;
}
.dd-controls { display: flex; gap: 8px; align-items: center; }
.dd-input {
  background: var(--bg-2); border: 1px solid var(--line);
  color: var(--ink); padding: 11px 16px;
  font-family: inherit; font-size: 13px;
  width: 240px; border-radius: 10px;
  box-shadow: var(--shadow-sm);
}
.dd-input:focus { outline: none; border-color: var(--pos-rb); }
.dd-btn {
  background: var(--ink); color: #fff; border: none;
  padding: 11px 22px; font-family: inherit;
  font-weight: 700; font-size: 13px;
  border-radius: 10px; cursor: pointer;
  transition: transform 0.1s, background 0.15s;
  box-shadow: var(--shadow-sm);
}
.dd-btn:hover { background: #2a2f3b; }
.dd-btn:active { transform: translateY(1px); }
.dd-btn:disabled { background: var(--ink-3); cursor: wait; }
.dd-status {
  background: var(--bg-2);
  border-left: 3px solid var(--pos-rb);
  border-radius: 10px;
  padding: 12px 16px; font-size: 13px;
  color: var(--ink-2); margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.dd-error {
  background: #fef0f0;
  border-left: 3px solid #e25555;
  border-radius: 10px;
  padding: 12px 16px; font-size: 13px;
  color: #a02828; margin-bottom: 14px;
}
.dd-meta {
  display: flex; flex-wrap: wrap; gap: 28px;
  padding: 16px 22px; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 14px;
  margin-bottom: 24px; box-shadow: var(--shadow-sm);
}
.dd-meta-k {
  font-size: 10px; color: var(--ink-3);
  letter-spacing: 0.16em; margin-right: 8px;
  text-transform: uppercase; font-weight: 700;
}
.dd-meta-v { font-size: 14px; font-weight: 600; }

/* ========== Roster strip with headshots ========== */
.dd-strip-wrap {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 18px 20px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
}
.dd-strip-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.dd-strip-title {
  font-size: 18px; font-weight: 800; letter-spacing: -0.01em;
}
.dd-strip-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.dd-strip-tier {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--rank-good);
  color: var(--rank-good-ink);
  padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
}
.dd-strip {
  display: flex; gap: 10px; overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: thin;
}
.dd-strip::-webkit-scrollbar { height: 8px; }
.dd-strip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

.dd-pchip {
  flex: 0 0 130px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
  transition: transform 0.12s, box-shadow 0.12s;
}
.dd-pchip:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.dd-pchip-tag {
  position: absolute; top: 8px; left: 8px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  padding: 3px 8px; border-radius: 999px;
  background: var(--pos-qb-bg); color: var(--pos-qb);
  text-transform: uppercase;
  z-index: 2;
}
.dd-pchip-tag.bench { background: #fde68a; color: #92400e; }
.dd-pchip-tag.start { background: #d6f5e8; color: #117a3a; }
.dd-pchip-img-wrap {
  position: relative;
  height: 110px;
  background: var(--pos-qb-bg);
  display: flex; align-items: flex-end; justify-content: center;
  overflow: hidden;
}
.dd-pchip-img {
  height: 105%;
  width: auto;
  object-fit: cover;
  object-position: center top;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
}
.dd-pchip-fallback {
  width: 70px; height: 70px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  display: grid; place-items: center;
  font-size: 22px; font-weight: 800;
  color: var(--ink); margin-bottom: 14px;
}
.dd-pchip-body {
  padding: 8px 10px 10px;
  text-align: center;
}
.dd-pchip-pos {
  display: inline-block;
  font-size: 10px; font-weight: 800;
  padding: 3px 8px; border-radius: 6px;
  background: var(--pos-qb); color: #fff;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.dd-pchip-name {
  font-size: 12px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.pos-QB    .dd-pchip-img-wrap { background: var(--pos-qb-bg); }
.pos-QB    .dd-pchip-pos { background: var(--pos-qb); }
.pos-RB    .dd-pchip-img-wrap { background: var(--pos-rb-bg); }
.pos-RB    .dd-pchip-pos { background: var(--pos-rb); }
.pos-WR    .dd-pchip-img-wrap { background: var(--pos-wr-bg); }
.pos-WR    .dd-pchip-pos { background: var(--pos-wr); }
.pos-TE    .dd-pchip-img-wrap { background: var(--pos-te-bg); }
.dd-pchip.pos-TE  .dd-pchip-pos { background: var(--pos-te); }
.dd-pchip.pos-DEF .dd-pchip-pos,
.dd-pchip.pos-K   .dd-pchip-pos { background: var(--ink-2); }

/* ========== Power Rankings (rows) ========== */
.dd-section {
  font-size: 18px; font-weight: 800; letter-spacing: -0.01em;
  margin: 0 0 12px; display: flex; align-items: center; gap: 12px;
}
.dd-section-legend {
  display: flex; gap: 12px; font-size: 11px; color: var(--ink-2);
  font-weight: 500; letter-spacing: 0; text-transform: none;
}
.dd-legend-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; margin-right: 5px; vertical-align: middle;
}

.dd-rank-list {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.dd-rank-row {
  display: grid;
  grid-template-columns: 60px minmax(160px,1fr) minmax(280px,2fr) auto;
  gap: 16px;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
  transition: background 0.12s;
  width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0;
  font-family: inherit; text-align: left; color: inherit;
}
.dd-rank-row:last-child { border-bottom: none; }
.dd-rank-row:hover { background: var(--bg-3); }
.dd-rank-row.active { background: var(--bg-3); }
.dd-rank-row.active .dd-rank-num { color: var(--ink); }

.dd-rank-num {
  font-size: 22px; font-weight: 800; color: var(--ink-3);
  letter-spacing: -0.02em;
}
.dd-rank-team-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
.dd-rank-team-owner { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

.dd-bar-track {
  width: 100%;
  display: flex; align-items: center;
}
.dd-bar-stack {
  display: flex; height: 14px; border-radius: 999px; overflow: hidden;
  background: var(--bg-3);
  width: 100%;
  transition: width 0.2s ease;
}
.dd-bar-seg {
  height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 10px; font-weight: 700;
  min-width: 0;
  transition: filter 0.12s;
}
.dd-bar-seg:hover { filter: brightness(1.05); }

.dd-rank-stats {
  display: flex; gap: 14px; align-items: center;
  font-size: 11px; color: var(--ink-2);
  flex-wrap: wrap; justify-content: flex-end;
}
.dd-rank-stat-k { color: var(--ink-3); margin-right: 4px; }
.dd-rank-stat-v { color: var(--ink); font-weight: 700; }
.dd-rank-tier {
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px;
  letter-spacing: 0.03em;
}

/* ========== Position Breakdown Columns ========== */
.dd-pos-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}
.dd-pos-col {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.dd-pos-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px;
  color: #fff; font-size: 13px; font-weight: 800;
  letter-spacing: 0.04em;
}
.dd-pos-head .dd-pos-rank {
  background: rgba(255,255,255,0.95);
  padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 800;
  min-width: 28px; text-align: center;
}
.col-QB    .dd-pos-head { background: var(--pos-qb); }    .col-QB    .dd-pos-head .dd-pos-rank { color: var(--pos-qb); }
.col-RB    .dd-pos-head { background: var(--pos-rb); }    .col-RB    .dd-pos-head .dd-pos-rank { color: var(--pos-rb); }
.col-WR    .dd-pos-head { background: var(--pos-wr); }    .col-WR    .dd-pos-head .dd-pos-rank { color: var(--pos-wr); }
.col-TE    .dd-pos-head { background: var(--pos-te); }    .col-TE    .dd-pos-head .dd-pos-rank { color: var(--pos-te); }
.col-PICKS .dd-pos-head { background: var(--pos-pk); }    .col-PICKS .dd-pos-head .dd-pos-rank { color: var(--pos-pk); }

.dd-pos-body { padding: 8px; }
.dd-pos-row {
  display: grid;
  grid-template-columns: 32px 1fr auto auto;
  gap: 8px; align-items: center;
  padding: 6px 8px;
  border-radius: 8px;
  font-size: 12px;
}
.dd-pos-row + .dd-pos-row { margin-top: 2px; }
.dd-pos-row:hover { background: var(--bg-3); }
.dd-pos-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg-3);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
  color: var(--ink-2);
  overflow: hidden;
  flex-shrink: 0;
}
.dd-pos-avatar img { width: 100%; height: 100%; object-fit: cover; }
.dd-pos-name {
  font-size: 12px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dd-pos-val {
  font-size: 11px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  min-width: 36px; text-align: right;
}
.dd-pos-rk-pill {
  font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px;
  min-width: 30px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.rk-good { background: var(--rank-good); color: var(--rank-good-ink); }
.rk-mid  { background: var(--rank-mid);  color: var(--rank-mid-ink); }
.rk-bad  { background: var(--rank-bad);  color: var(--rank-bad-ink); }

.dd-pick-row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 8px; align-items: center;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
}
.dd-pick-row + .dd-pick-row { margin-top: 2px; }
.dd-pick-row:hover { background: var(--bg-3); }
.dd-pick-icon {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  font-size: 14px;
}

.dd-empty-state {
  text-align: center; padding: 80px 20px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--ink-2); box-shadow: var(--shadow-sm);
}
.dd-empty-state .dim { color: var(--ink-3); font-size: 13px; margin-top: 8px; }

@media (max-width: 1100px) {
  .dd-pos-grid { grid-template-columns: repeat(2, 1fr); }
  .dd-rank-row { grid-template-columns: 48px 1fr 100%; row-gap: 10px; }
  .dd-rank-stats { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (max-width: 720px) {
  .dd-root { padding: 18px; }
  .dd-header { flex-direction: column; align-items: stretch; }
  .dd-controls { width: 100%; }
  .dd-input { flex: 1; width: auto; }
  .dd-pos-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
  }
}
</script>

<script type="module">
import React, { useState, useMemo } from "react";
import { createRoot } from "react-dom/client";

const e = React.createElement;
const fmt = (n) => (typeof n === "number" ? Math.round(n).toLocaleString() : "—");

const POS_COLORS = {
  QB: { hex: "#10b981" },
  RB: { hex: "#3b82f6" },
  WR: { hex: "#ec4899" },
  TE: { hex: "#a855f7" },
  PICKS: { hex: "#f59e0b" }
};

function rebuildScore(age, pos) {
  if (!age) return 0.5;
  const peakByPos = { QB: 30, RB: 25, WR: 27, TE: 28 };
  const peak = peakByPos[pos] || 27;
  if (age <= peak - 4) return 0.95;
  if (age <= peak - 2) return 0.8;
  if (age <= peak) return 0.6;
  if (age <= peak + 2) return 0.4;
  if (age <= peak + 4) return 0.2;
  return 0.05;
}

function normName(s) {
  return (s || "").toLowerCase()
    .replace(/[^a-z0-9 ]/g, "")
    .replace(/\b(jr|sr|ii|iii|iv)\b/g, "")
    .replace(/\s+/g, " ").trim();
}

function shortName(name) {
  if (!name) return "";
  const parts = name.split(" ");
  if (parts.length === 1) return parts[0];
  return parts[0][0] + ". " + parts.slice(1).join(" ");
}

function initials(name) {
  if (!name) return "?";
  const parts = name.split(" ").filter(Boolean);
  if (parts.length === 1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function slotMatches(slot, pos) {
  if (!pos) return false;
  if (slot === pos) return true;
  if (slot === "FLEX") return ["RB", "WR", "TE"].includes(pos);
  if (slot === "SUPER_FLEX" || slot === "SUPERFLEX")
    return ["QB", "RB", "WR", "TE"].includes(pos);
  if (slot === "REC_FLEX") return ["WR", "TE"].includes(pos);
  if (slot === "WRRB_FLEX" || slot === "WRRB") return ["RB", "WR"].includes(pos);
  return false;
}

function pickStarters(playerIds, valueMap, rosterPositions) {
  const slots = (rosterPositions || []).filter(
    (p) => p !== "BN" && p !== "TAXI" && p !== "IR"
  );
  const pool = playerIds.map((id) => valueMap[id]).filter(Boolean)
    .sort((a, b) => b.value - a.value);
  const used = new Set();
  const starters = [];
  let totalStarterValue = 0;
  for (const slot of slots) {
    let pick = null;
    for (const p of pool) {
      if (used.has(p.id)) continue;
      if (slotMatches(slot, p.position)) { pick = p; break; }
    }
    if (pick) {
      used.add(pick.id);
      starters.push({ slot, ...pick });
      totalStarterValue += pick.value;
    } else {
      starters.push({ slot, empty: true });
    }
  }
  const benchIds = playerIds.filter((id) => !used.has(id));
  const bench = benchIds
    .map((id) => valueMap[id])
    .filter(Boolean)
    .sort((a, b) => b.value - a.value);
  return { starters, bench, totalStarterValue };
}

function approxPickValue(season, round, currentSeason, isSF) {
  const yearsOut = Math.max(0, season - currentSeason);
  const base = isSF
    ? { 1: 5500, 2: 2400, 3: 900, 4: 350 }
    : { 1: 4200, 2: 1700, 3: 600, 4: 200 };
  const v = base[round] || 100;
  return Math.round(v * Math.pow(0.85, yearsOut));
}

function rankClass(rank, total) {
  if (!rank || !total) return "rk-mid";
  const p = rank / total;
  if (p <= 0.25) return "rk-good";
  if (p <= 0.6)  return "rk-mid";
  return "rk-bad";
}

function tierFor(rank, total) {
  if (rank === 1) return { label: "Juggernaut", cls: "rk-good" };
  if (rank <= 3)  return { label: "Contender",  cls: "rk-good" };
  if (rank <= Math.ceil(total / 2)) return { label: "Riser", cls: "rk-mid" };
  if (rank <= total - 2) return { label: "Pretender", cls: "rk-bad" };
  return { label: "Rebuilder", cls: "rk-bad" };
}

function PlayerImage({ pid, name, position }) {
  const [errored, setErrored] = useState(false);
  if (!pid || errored) {
    return e('div', { className: 'dd-pchip-fallback' }, initials(name));
  }
  return e('img', {
    className: 'dd-pchip-img',
    src: `https://sleepercdn.com/content/nfl/players/${pid}.jpg`,
    alt: name,
    onError: () => setErrored(true)
  });
}

function PlayerAvatar({ pid, name }) {
  const [errored, setErrored] = useState(false);
  return e('div', { className: 'dd-pos-avatar' },
    (!pid || errored)
      ? initials(name)
      : e('img', {
          src: `https://sleepercdn.com/content/nfl/players/thumb/${pid}.jpg`,
          alt: name,
          onError: () => setErrored(true)
        })
  );
}

function DynastyAnalyzer() {
  const [leagueId, setLeagueId] = useState("1180088667355451392");
  const [loading, setLoading] = useState(false);
  const [stage, setStage] = useState("");
  const [error, setError] = useState("");
  const [league, setLeague] = useState(null);
  const [users, setUsers] = useState([]);
  const [rosters, setRosters] = useState([]);
  const [valueMap, setValueMap] = useState({});
  const [valueSource, setValueSource] = useState("");
  const [tradedPicks, setTradedPicks] = useState([]);
  const [activeTeamId, setActiveTeamId] = useState(null);

  const isSuperflex = useMemo(() => {
    const slots = league?.roster_positions || [];
    return slots.includes("SUPER_FLEX") || slots.includes("SUPERFLEX");
  }, [league]);

  async function loadLeague() {
    setError(""); setLoading(true);
    setLeague(null); setRosters([]); setUsers([]); setValueMap({});
    try {
      setStage("Pulling league settings…");
      const lg = await fetch(`https://api.sleeper.app/v1/league/${leagueId}`).then(r => {
        if (!r.ok) throw new Error("League not found — check the ID");
        return r.json();
      });
      setLeague(lg);

      setStage("Pulling rosters & users…");
      const [rs, us, picks] = await Promise.all([
        fetch(`https://api.sleeper.app/v1/league/${leagueId}/rosters`).then(r => r.json()),
        fetch(`https://api.sleeper.app/v1/league/${leagueId}/users`).then(r => r.json()),
        fetch(`https://api.sleeper.app/v1/league/${leagueId}/traded_picks`)
          .then(r => r.ok ? r.json() : []).catch(() => [])
      ]);
      setRosters(rs || []); setUsers(us || []); setTradedPicks(picks || []);

      setStage("Pulling Sleeper player metadata (~5MB, one-time)…");
      const players = await fetch("https://api.sleeper.app/v1/players/nfl").then(r => r.json());

      setStage("Pulling KeepTradeCut dynasty values…");
      const sf = lg.roster_positions?.includes("SUPER_FLEX") || lg.roster_positions?.includes("SUPERFLEX");
      const vm = await loadValues(players, sf);
      setValueMap(vm.map);
      setValueSource(vm.source);

      const me = (us || []).find(u =>
        u.display_name?.toLowerCase() === "dwooley9" ||
        u.display_name?.toLowerCase().includes("dwooley")
      );
      if (me) {
        const myRoster = (rs || []).find(r => r.owner_id === me.user_id);
        if (myRoster) setActiveTeamId(myRoster.roster_id);
      }
      setStage("");
    } catch (err) {
      setError(err.message || "Something broke. Check the league ID.");
      setStage("");
    } finally {
      setLoading(false);
    }
  }

  async function fetchKtcPlayersArray() {
    // KTC embeds the live rankings as `var playersArray = [...]` inside the
    // /dynasty-rankings HTML page. There's no public JSON API, and the page
    // blocks cross-origin fetches, so we go through a CORS proxy chain.
    const target = "https://keeptradecut.com/dynasty-rankings/";
    const proxies = [
      (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
      (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
      (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
      (u) => `https://cors.eu.org/${u}`
    ];
    for (const make of proxies) {
      try {
        const res = await fetch(make(target));
        if (!res.ok) continue;
        const html = await res.text();
        const idx = html.indexOf("var playersArray");
        if (idx < 0) continue;
        const start = html.indexOf("[", idx);
        if (start < 0) continue;
        // Walk bracket depth so we don't trip on `]` inside string values.
        let depth = 0, inStr = null, esc = false, end = -1;
        for (let i = start; i < html.length; i++) {
          const c = html[i];
          if (esc) { esc = false; continue; }
          if (inStr) {
            if (c === "\\") { esc = true; continue; }
            if (c === inStr) inStr = null;
            continue;
          }
          if (c === '"' || c === "'") { inStr = c; continue; }
          if (c === "[") depth++;
          else if (c === "]") { depth--; if (depth === 0) { end = i; break; } }
        }
        if (end < 0) continue;
        const literal = html.slice(start, end + 1);
        let data;
        try { data = JSON.parse(literal); }
        catch (_) { data = Function('"use strict"; return (' + literal + ')')(); }
        if (Array.isArray(data) && data.length > 100) return data;
      } catch (_) {}
    }
    return null;
  }

  async function loadValues(players, sf) {
    const ktcData = await fetchKtcPlayersArray();
    if (ktcData) {
      const map = mergeValues(players, ktcData, "ktc", sf);
      if (Object.values(map).some(p => p.value > 0)) {
        return { map, source: "KeepTradeCut (live)" };
      }
    }
    try {
      const res = await fetch(`https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=${sf ? 2 : 1}&numTeams=12&ppr=1`);
      const data = await res.json();
      const map = mergeValues(players, data, "fc", sf);
      return { map, source: "FantasyCalc (KTC unreachable)" };
    } catch (e2) {
      throw new Error("Couldn't load player values from KTC or FantasyCalc.");
    }
  }

  function mergeValues(players, valueData, source, sf) {
    const byName = {};
    if (source === "ktc") {
      for (const row of valueData || []) {
        const v = sf
          ? (row.superflexValues?.value ?? row.oneQBValues?.value)
          : (row.oneQBValues?.value ?? row.superflexValues?.value);
        if (!v) continue;
        byName[normName(row.playerName)] = { value: v, position: row.position, name: row.playerName };
      }
    } else {
      const list = valueData?.players || valueData || [];
      for (const row of list) {
        const v = row.value;
        const name = row.player?.name || row.name;
        const pos = row.player?.position || row.position;
        if (!v || !name) continue;
        byName[normName(name)] = { value: v, position: pos, name };
      }
    }
    const map = {};
    for (const [pid, p] of Object.entries(players || {})) {
      if (!p?.full_name) continue;
      const hit = byName[normName(p.full_name)];
      map[pid] = {
        id: pid, name: p.full_name, position: p.position,
        team: p.team, age: p.age,
        value: hit ? hit.value : 0
      };
    }
    return map;
  }

  // Build league-wide position ranks (across all rostered players in this league)
  const leaguePosRanks = useMemo(() => {
    if (!rosters.length || !Object.keys(valueMap).length) return {};
    const byPos = { QB: [], RB: [], WR: [], TE: [] };
    const rosteredIds = new Set();
    for (const r of rosters) for (const id of (r.players || [])) rosteredIds.add(id);
    for (const id of rosteredIds) {
      const p = valueMap[id];
      if (!p || !p.position || !byPos[p.position]) continue;
      byPos[p.position].push(p);
    }
    const ranks = {};
    for (const pos of Object.keys(byPos)) {
      byPos[pos].sort((a, b) => b.value - a.value);
      byPos[pos].forEach((p, i) => { ranks[p.id] = i + 1; });
    }
    return ranks;
  }, [rosters, valueMap]);

  const teamCards = useMemo(() => {
    if (!league || !rosters.length || !Object.keys(valueMap).length) return [];
    const leagueSeason = parseInt(league.season || `${new Date().getFullYear()}`, 10);
    const currentSeason = league.status === 'complete' ? leagueSeason + 1 : leagueSeason;
    const sf = isSuperflex;

    function picksForRoster(rosterId) {
      const seasons = [currentSeason + 1, currentSeason + 2];
      const allPicks = [];
      for (const s of seasons) {
        for (let r = 1; r <= 4; r++) {
          for (const ros of rosters) {
            allPicks.push({ season: s, round: r, original: ros.roster_id, owner: ros.roster_id });
          }
        }
      }
      for (const t of tradedPicks) {
        const pick = allPicks.find(p =>
          p.season === parseInt(t.season, 10) &&
          p.round === t.round &&
          p.original === t.roster_id
        );
        if (pick) pick.owner = t.owner_id;
      }
      return allPicks.filter(p => p.owner === rosterId).map(p => ({
        ...p,
        value: approxPickValue(p.season, p.round, currentSeason, sf),
        label: `${p.season} R${p.round}${p.original !== rosterId ? " (via trade)" : ""}`
      }));
    }

    return rosters.map(r => {
      const playerIds = r.players || [];
      const owned = playerIds.map(id => valueMap[id]).filter(p => p && p.value > 0);
      const totalValue = owned.reduce((a, b) => a + b.value, 0);
      const ageList = owned.filter(p => p.age);
      const avgAge = ageList.length ? ageList.reduce((a, b) => a + b.age, 0) / ageList.length : 0;
      const { starters, bench, totalStarterValue } = pickStarters(playerIds, valueMap, league.roster_positions);
      const youngScore = owned.reduce(
        (acc, p) => acc + p.value * rebuildScore(p.age, p.position), 0
      ) / (totalValue || 1);
      const picks = picksForRoster(r.roster_id);
      const pickValue = picks.reduce((a, b) => a + b.value, 0);
      const user = users.find(u => u.user_id === r.owner_id);

      // Position breakdown for this team
      const byPos = { QB: [], RB: [], WR: [], TE: [] };
      for (const p of owned) {
        if (byPos[p.position]) byPos[p.position].push(p);
      }
      const posValues = {};
      for (const pos of Object.keys(byPos)) {
        byPos[pos].sort((a, b) => b.value - a.value);
        posValues[pos] = byPos[pos].reduce((a, p) => a + p.value, 0);
      }
      posValues.PICKS = pickValue;

      return {
        id: r.roster_id,
        owner: user?.display_name || `Team ${r.roster_id}`,
        teamName: user?.metadata?.team_name || user?.display_name || `Team ${r.roster_id}`,
        avatar: user?.avatar,
        totalValue, totalStarterValue, pickValue,
        combinedValue: totalValue + pickValue,
        avgAge, youngScore,
        wins: r.settings?.wins || 0,
        losses: r.settings?.losses || 0,
        ties: r.settings?.ties || 0,
        pointsFor: ((r.settings?.fpts || 0) + (r.settings?.fpts_decimal || 0) / 100),
        pointsAgainst: ((r.settings?.fpts_against || 0) + (r.settings?.fpts_against_decimal || 0) / 100),
        streak: r.metadata?.streak || "",
        starters, bench,
        roster: owned.sort((a, b) => b.value - a.value),
        byPos,
        posValues,
        picks: picks.sort((a, b) => a.season - b.season || a.round - b.round)
      };
    }).sort((a, b) => b.combinedValue - a.combinedValue);
  }, [league, rosters, users, valueMap, tradedPicks, isSuperflex]);

  // Compute team rank within each position group
  const posRankings = useMemo(() => {
    const out = {};
    for (const pos of ["QB", "RB", "WR", "TE", "PICKS"]) {
      const sorted = [...teamCards].sort((a, b) => (b.posValues[pos] || 0) - (a.posValues[pos] || 0));
      sorted.forEach((t, i) => {
        out[t.id] = out[t.id] || {};
        out[t.id][pos] = i + 1;
      });
    }
    return out;
  }, [teamCards]);

  const totalTeams = teamCards.length;
  const activeTeam = teamCards.find(t => t.id === activeTeamId);
  const activeTeamRank = activeTeam ? teamCards.findIndex(t => t.id === activeTeamId) + 1 : 0;

  return e('div', { className: 'dd-root' },
    e('header', { className: 'dd-header' },
      e('div', { className: 'dd-brand' },
        e('div', { className: 'dd-brand-mark' }, '🏈'),
        e('div', null,
          e('div', { className: 'dd-brand-title' }, 'Dynasty League Analyzer'),
          e('div', { className: 'dd-brand-sub' }, 'Sleeper × KeepTradeCut · Power Rankings & Roster Construction')
        )
      ),
      e('div', { className: 'dd-controls' },
        e('input', {
          value: leagueId,
          onChange: (ev) => setLeagueId(ev.target.value.trim()),
          placeholder: 'Sleeper League ID',
          className: 'dd-input'
        }),
        e('button', {
          onClick: loadLeague,
          disabled: loading,
          className: 'dd-btn'
        }, loading ? 'Loading…' : 'Analyze')
      )
    ),
    stage && e('div', { className: 'dd-status' }, '▸ ' + stage),
    error && e('div', { className: 'dd-error' }, '⚠ ' + error),
    league && e('div', { className: 'dd-meta' },
      e('div', null,
        e('span', { className: 'dd-meta-k' }, 'League'),
        e('span', { className: 'dd-meta-v' }, league.name)
      ),
      e('div', null,
        e('span', { className: 'dd-meta-k' }, 'Season'),
        e('span', { className: 'dd-meta-v' }, (league.status === 'complete' ? (parseInt(league.season, 10) + 1) + ` (${league.season} complete)` : league.season))
      ),
      e('div', null,
        e('span', { className: 'dd-meta-k' }, 'Format'),
        e('span', { className: 'dd-meta-v' },
          (isSuperflex ? 'Superflex' : '1QB') + ' · ' +
          (league.scoring_settings?.rec === 1 ? 'PPR'
            : league.scoring_settings?.rec === 0.5 ? 'Half-PPR' : 'Std')
        )
      ),
      e('div', null,
        e('span', { className: 'dd-meta-k' }, 'Teams'),
        e('span', { className: 'dd-meta-v' }, rosters.length)
      ),
      valueSource && e('div', null,
        e('span', { className: 'dd-meta-k' }, 'Values'),
        e('span', { className: 'dd-meta-v' }, valueSource)
      )
    ),

    // Roster strip with headshots
    activeTeam && (() => {
      const tier = tierFor(activeTeamRank, totalTeams);
      return e('div', { className: 'dd-strip-wrap' },
        e('div', { className: 'dd-strip-head' },
          e('div', null,
            e('div', { className: 'dd-strip-title' }, activeTeam.teamName),
            e('div', { className: 'dd-strip-sub' }, '@' + activeTeam.owner + ' · Click another team below to switch')
          ),
          e('div', { className: 'dd-strip-tier ' + tier.cls,
                    style: { background: tier.cls === 'rk-good' ? 'var(--rank-good)' :
                                       tier.cls === 'rk-mid'  ? 'var(--rank-mid)'  : 'var(--rank-bad)',
                             color:      tier.cls === 'rk-good' ? 'var(--rank-good-ink)' :
                                       tier.cls === 'rk-mid'  ? 'var(--rank-mid-ink)'  : 'var(--rank-bad-ink)' } },
            tier.label
          )
        ),
        e('div', { className: 'dd-strip' },
          [
            ...activeTeam.starters
              .filter(s => !s.empty)
              .map(s => ({ ...s, _tag: 'start' })),
            ...activeTeam.bench.map(p => ({ ...p, _tag: 'bench' }))
          ].map((p, i) => {
            const pos = p.position || 'NA';
            const lgRank = leaguePosRanks[p.id];
            return e('div', { key: p.id || i, className: 'dd-pchip pos-' + pos },
              e('div', { className: 'dd-pchip-tag ' + p._tag }, p._tag === 'start' ? 'Starting' : 'Bench'),
              e('div', { className: 'dd-pchip-img-wrap' },
                e(PlayerImage, { pid: p.id, name: p.name, position: pos })
              ),
              e('div', { className: 'dd-pchip-body' },
                e('div', { className: 'dd-pchip-pos' }, pos + (lgRank ? ' ' + lgRank : '')),
                e('div', { className: 'dd-pchip-name' }, shortName(p.name))
              )
            );
          })
        )
      );
    })(),

    teamCards.length > 0 && e(React.Fragment, null,
      e('h2', { className: 'dd-section' },
        'Power Rankings',
        e('div', { className: 'dd-section-legend' },
          e('span', null, e('span', { className: 'dd-legend-dot', style: { background: POS_COLORS.QB.hex } }), 'QB'),
          e('span', null, e('span', { className: 'dd-legend-dot', style: { background: POS_COLORS.RB.hex } }), 'RB'),
          e('span', null, e('span', { className: 'dd-legend-dot', style: { background: POS_COLORS.WR.hex } }), 'WR'),
          e('span', null, e('span', { className: 'dd-legend-dot', style: { background: POS_COLORS.TE.hex } }), 'TE'),
          e('span', null, e('span', { className: 'dd-legend-dot', style: { background: POS_COLORS.PICKS.hex } }), 'PICKS')
        )
      ),
      e('div', { className: 'dd-rank-list' },
        (() => {
          const maxCombinedValue = Math.max(...teamCards.map(t => t.combinedValue || 0), 1);
          return teamCards.map((t, i) => {
          const rank = i + 1;
          const tier = tierFor(rank, totalTeams);
          const total = (t.posValues.QB || 0) + (t.posValues.RB || 0) +
                        (t.posValues.WR || 0) + (t.posValues.TE || 0) +
                        (t.posValues.PICKS || 0) || 1;
          const segs = ["QB", "RB", "WR", "TE", "PICKS"].map(pos => ({
            pos, pct: ((t.posValues[pos] || 0) / total) * 100,
            rank: posRankings[t.id]?.[pos]
          }));
          const barWidthPct = ((t.combinedValue || 0) / maxCombinedValue) * 100;
          return e('button', {
            key: t.id,
            onClick: () => setActiveTeamId(t.id),
            className: 'dd-rank-row' + (activeTeamId === t.id ? ' active' : '')
          },
            e('div', { className: 'dd-rank-num' }, rank),
            e('div', null,
              e('div', { className: 'dd-rank-team-name' }, t.teamName),
              e('div', { className: 'dd-rank-team-owner' }, '@' + t.owner)
            ),
            e('div', { className: 'dd-bar-track' },
              e('div', { className: 'dd-bar-stack', style: { width: barWidthPct + '%' } },
                segs.map(s => s.pct > 0 && e('div', {
                  key: s.pos,
                  className: 'dd-bar-seg',
                  style: { width: s.pct + '%', background: POS_COLORS[s.pos].hex },
                  title: `${s.pos}: ${fmt(t.posValues[s.pos] || 0)} (rank ${s.rank}/${totalTeams})`
                }, s.pct > 6 ? (s.rank || '') : ''))
              )
            ),
            e('div', { className: 'dd-rank-stats' },
              e('span', null,
                e('span', { className: 'dd-rank-stat-k' }, 'Record'),
                e('span', { className: 'dd-rank-stat-v' }, t.wins + '-' + t.losses + (t.ties ? '-' + t.ties : ''))
              ),
              e('span', null,
                e('span', { className: 'dd-rank-stat-k' }, 'Value'),
                e('span', { className: 'dd-rank-stat-v' }, fmt(t.combinedValue))
              ),
              e('span', null,
                e('span', { className: 'dd-rank-stat-k' }, 'Avg Age'),
                e('span', { className: 'dd-rank-stat-v' }, t.avgAge ? t.avgAge.toFixed(1) : '—')
              ),
              e('span', { className: 'dd-rank-tier ' + tier.cls,
                          style: { background: tier.cls === 'rk-good' ? 'var(--rank-good)' :
                                             tier.cls === 'rk-mid'  ? 'var(--rank-mid)'  : 'var(--rank-bad)',
                                   color:      tier.cls === 'rk-good' ? 'var(--rank-good-ink)' :
                                             tier.cls === 'rk-mid'  ? 'var(--rank-mid-ink)'  : 'var(--rank-bad-ink)' } },
                tier.label)
            )
          );
        });
        })()
      ),

      // Position breakdown columns
      activeTeam && e('div', { className: 'dd-pos-grid' },
        ["QB", "RB", "WR", "TE"].map(pos => {
          const players = activeTeam.byPos[pos] || [];
          const teamRank = posRankings[activeTeam.id]?.[pos];
          return e('div', { key: pos, className: 'dd-pos-col col-' + pos },
            e('div', { className: 'dd-pos-head' },
              e('span', null, pos + ' Rank'),
              e('span', { className: 'dd-pos-rank' }, teamRank || '—')
            ),
            e('div', { className: 'dd-pos-body' },
              players.length === 0
                ? e('div', { style: { padding: '12px', color: 'var(--ink-3)', fontSize: '12px' } }, 'No players')
                : players.map((p, i) => {
                    const lgRank = leaguePosRanks[p.id];
                    const totalAtPos = Object.values(leaguePosRanks).filter((_, idx) => true).length;
                    // We don't know total per-pos cleanly here; use tier on percentile vs starter cutoff
                    const cls = !lgRank ? 'rk-bad' :
                      lgRank <= (pos === 'TE' ? 12 : pos === 'QB' ? 12 : 24) ? 'rk-good' :
                      lgRank <= (pos === 'TE' ? 24 : pos === 'QB' ? 24 : 48) ? 'rk-mid' : 'rk-bad';
                    return e('div', { key: p.id, className: 'dd-pos-row' },
                      e(PlayerAvatar, { pid: p.id, name: p.name }),
                      e('div', { className: 'dd-pos-name' }, p.name),
                      e('div', { className: 'dd-pos-val' }, fmt(p.value)),
                      e('div', { className: 'dd-pos-rk-pill ' + cls }, lgRank || '—')
                    );
                  })
            )
          );
        }).concat([
          e('div', { key: 'PICKS', className: 'dd-pos-col col-PICKS' },
            e('div', { className: 'dd-pos-head' },
              e('span', null, 'PICKS'),
              e('span', { className: 'dd-pos-rank' }, posRankings[activeTeam.id]?.PICKS || '—')
            ),
            e('div', { className: 'dd-pos-body' },
              activeTeam.picks.length === 0
                ? e('div', { style: { padding: '12px', color: 'var(--ink-3)', fontSize: '12px' } }, 'No future picks')
                : activeTeam.picks.map((p, i) => e('div', { key: i, className: 'dd-pick-row' },
                    e('span', { className: 'dd-pick-icon' }, '🎟️'),
                    e('span', { className: 'dd-pos-name' }, p.label),
                    e('span', { className: 'dd-pos-val' }, fmt(p.value))
                  ))
            )
          )
        ])
      )
    ),
    !league && !loading && e('div', { className: 'dd-empty-state' },
      e('p', null, 'Plug in a Sleeper league ID and hit Analyze. Your league (1180088667355451392) is pre-loaded.'),
      e('p', { className: 'dim' }, 'First load fetches ~5MB of Sleeper player metadata + KTC values. Takes 5–15 seconds. Click any team row to see its roster strip and position breakdown.')
    )
  );
}

createRoot(document.getElementById("root")).render(e(DynastyAnalyzer));
</script>
</body>
</html>
