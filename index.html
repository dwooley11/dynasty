<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dynasty League Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7fb;
  --bg-2: #ffffff;
  --bg-3: #f0f2f7;
  --line: #e4e7ee;
  --line-2: #eef0f5;
  --ink: #1a1d23;
  --ink-2: #5b6271;
  --ink-3: #98a0ad;

  --pos-qb: #10b981;
  --pos-qb-bg: #d6f5e8;
  --pos-rb: #3b82f6;
  --pos-rb-bg: #d8e6fb;
  --pos-wr: #ec4899;
  --pos-wr-bg: #fbdcea;
  --pos-te: #a855f7;
  --pos-te-bg: #ecddfb;
  --pos-pk: #f59e0b;
  --pos-pk-bg: #fcedcf;

  --rank-good: #d3f5dc;
  --rank-good-ink: #117a3a;
  --rank-mid:  #fdf3cf;
  --rank-mid-ink:  #8a6b13;
  --rank-bad:  #fbdada;
  --rank-bad-ink:  #a02828;

  --shadow-sm: 0 1px 2px rgba(20,25,40,0.04), 0 1px 1px rgba(20,25,40,0.03);
  --shadow-md: 0 4px 14px rgba(20,25,40,0.06), 0 1px 3px rgba(20,25,40,0.04);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.dd-root { padding: 28px 36px; max-width: 1600px; margin: 0 auto; }

.dd-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding-bottom: 22px; margin-bottom: 24px;
  gap: 16px; flex-wrap: wrap;
}
.dd-brand { display: flex; align-items: center; gap: 14px; }
.dd-brand-mark {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  display: grid; place-items: center;
  font-size: 26px; color: #fff; border-radius: 14px;
  box-shadow: var(--shadow-md);
}
.dd-brand-title {
  font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1;
}
.dd-brand-sub {
  font-size: 13px; color: var(--ink-2);
  margin-top: 4px;
}
.dd-controls { display: flex; gap: 8px; align-items: center; }
.dd-input {
  background: var(--bg-2); border: 1px solid var(--line);
  color: var(--ink); padding: 11px 16px;
  font-family: inherit; font-size: 13px;
  width: 240px; border-radius: 10px;
  box-shadow: var(--shadow-sm);
}
.dd-input:focus { outline: none; border-color: var(--pos-rb); }
.dd-btn {
  background: var(--ink); color: #fff; border: none;
  padding: 11px 22px; font-family: inherit;
  font-weight: 700; font-size: 13px;
  border-radius: 10px; cursor: pointer;
  transition: transform 0.1s, background 0.15s;
  box-shadow: var(--shadow-sm);
}
.dd-btn:hover { background: #2a2f3b; }
.dd-btn:active { transform: translateY(1px); }
.dd-btn:disabled { background: var(--ink-3); cursor: wait; }
.dd-status {
  background: var(--bg-2);
  border-left: 3px solid var(--pos-rb);
  border-radius: 10px;
  padding: 12px 16px; font-size: 13px;
  color: var(--ink-2); margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.dd-error {
  background: #fef0f0;
  border-left: 3px solid #e25555;
  border-radius: 10px;
  padding: 12px 16px; font-size: 13px;
  color: #a02828; margin-bottom: 14px;
}
.dd-meta {
  display: flex; flex-wrap: wrap; gap: 28px;
  padding: 16px 22px; background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 14px;
  margin-bottom: 24px; box-shadow: var(--shadow-sm);
}
.dd-meta-k {
  font-size: 10px; color: var(--ink-3);
  letter-spacing: 0.16em; margin-right: 8px;
  text-transform: uppercase; font-weight: 700;
}
.dd-meta-v { font-size: 14px; font-weight: 600; }

/* ========== Roster strip with headshots ========== */
.dd-strip-wrap {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 18px 20px;
  margin-bottom: 22px;
  box-shadow: var(--shadow-sm);
}
.dd-strip-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.dd-strip-title {
  font-size: 18px; font-weight: 800; letter-spacing: -0.01em;
}
.dd-strip-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.dd-strip-tier {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--rank-good);
  color: var(--rank-good-ink);
  padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
}
.dd-strip {
  display: flex; gap: 10px; overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: thin;
}
.dd-strip::-webkit-scrollbar { height: 8px; }
.dd-strip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

.dd-pchip {
  flex: 0 0 130px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
  transition: transform 0.12s, box-shadow 0.12s;
}
.dd-pchip:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.dd-pchip-tag {
  position: absolute; top: 8px; left: 8px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  padding: 3px 8px; border-radius: 999px;
  background: var(--pos-qb-bg); color: var(--pos-qb);
  text-transform: uppercase;
  z-index: 2;
}
.dd-pchip-tag.bench { background: #fde68a; color: #92400e; }
.dd-pchip-tag.start { background: #d6f5e8; color: #117a3a; }
.dd-pchip-img-wrap {
  position: relative;
  height: 110px;
  background: var(--pos-qb-bg);
  display: flex; align-items: flex-end; justify-content: center;
  overflow: hidden;
}
.dd-pchip-img {
  height: 105%;
  width: auto;
  object-fit: cover;
  object-position: center top;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
}
.dd-pchip-fallback {
  width: 70px; height: 70px;
  border-radius: 50%;
  background: rgba(255,255,255,0.6);
  display: grid; place-items: center;
  font-size: 22px; font-weight: 800;
  color: var(--ink); margin-bottom: 14px;
}
.dd-pchip-body {
  padding: 8px 10px 10px;
  text-align: center;
}
.dd-pchip-pos {
  display: inline-block;
  font-size: 10px; font-weight: 800;
  padding: 3px 8px; border-radius: 6px;
  background: var(--pos-qb); color: #fff;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.dd-pchip-name {
  font-size: 12px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.pos-QB    .dd-pchip-img-wrap { background: var(--pos-qb-bg); }
.pos-QB    .dd-pchip-pos { background: var(--pos-qb); }
.pos-RB    .dd-pchip-img-wrap { background: var(--pos-rb-bg); }
.pos-RB    .dd-pchip-pos { background: var(--pos-rb); }
.pos-WR    .dd-pchip-img-wrap { background: var(--pos-wr-bg); }
.pos-WR    .dd-pchip-pos { background: var(--pos-wr); }
.pos-TE    .dd-pchip-img-wrap { background: var(--pos-te-bg); }
.dd-pchip.pos-TE  .dd-pchip-pos { background: var(--pos-te); }
.dd-pchip.pos-DEF .dd-pchip-pos,
.dd-pchip.pos-K   .dd-pchip-pos { background: var(--ink-2); }

/* ========== Power Rankings (rows) ========== */
.dd-section {
  font-size: 18px; font-weight: 800; letter-spacing: -0.01em;
  margin: 0 0 12px; display: flex; align-items: center; gap: 12px;
}
.dd-section-legend {
  display: flex; gap: 12px; font-size: 11px; color: var(--ink-2);
  font-weight: 500; letter-spacing: 0; text-transform: none;
}
.dd-legend-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; margin-right: 5px; vertical-align: middle;
}

.dd-rank-list {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}
.dd-rank-row {
  display: grid;
  grid-template-columns: 60px minmax(160px,1fr) minmax(220px,2fr) 360px;
  gap: 16px;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-2);
  cursor: pointer;
  transition: background 0.12s;
  width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0;
  font-family: inherit; text-align: left; color: inherit;
}
.dd-rank-row:last-child { border-bottom: none; }
.dd-rank-row:hover { background: var(--bg-3); }
.dd-rank-row.active { background: var(--bg-3); }
.dd-rank-row.active .dd-rank-num { color: var(--ink); }

.dd-rank-num {
  font-size: 22px; font-weight: 800; color: var(--ink-3);
  letter-spacing: -0.02em;
}
.dd-rank-team-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
.dd-rank-team-owner { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

.dd-bar-track {
  width: 100%;
  display: flex; align-items: center;
}
.dd-bar-stack {
  display: flex; height: 14px; border-radius: 999px; overflow: hidden;
  background: var(--bg-3);
  width: 100%;
  transition: width 0.2s ease;
}
.dd-bar-seg {
  height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 10px; font-weight: 700;
  min-width: 0;
  transition: filter 0.12s;
}
.dd-bar-seg:hover { filter: brightness(1.05); }

.dd-rank-stats {
  display: grid;
  grid-template-columns: 78px 96px 78px 84px;
  gap: 12px; align-items: center;
  font-size: 11px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.dd-rank-stats > span {
  display: inline-flex; align-items: baseline;
  white-space: nowrap;
}
.dd-rank-stat-k { color: var(--ink-3); margin-right: 4px; }
.dd-rank-stat-v { color: var(--ink); font-weight: 700; }
.dd-rank-tier {
  font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px;
  letter-spacing: 0.03em;
}

/* ========== Position Breakdown Columns ========== */
.dd-pos-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}
.dd-pos-col {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.dd-pos-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px;
  color: #fff; font-size: 13px; font-weight: 800;
  letter-spacing: 0.04em;
}
.dd-pos-head .dd-pos-rank {
  background: rgba(255,255,255,0.95);
  padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 800;
  min-width: 28px; text-align: center;
}
.col-QB    .dd-pos-head { background: var(--pos-qb); }    .col-QB    .dd-pos-head .dd-pos-rank { color: var(--pos-qb); }
.col-RB    .dd-pos-head { background: var(--pos-rb); }    .col-RB    .dd-pos-head .dd-pos-rank { color: var(--pos-rb); }
.col-WR    .dd-pos-head { background: var(--pos-wr); }    .col-WR    .dd-pos-head .dd-pos-rank { color: var(--pos-wr); }
.col-TE    .dd-pos-head { background: var(--pos-te); }    .col-TE    .dd-pos-head .dd-pos-rank { color: var(--pos-te); }
.col-PICKS .dd-pos-head { background: var(--pos-pk); }    .col-PICKS .dd-pos-head .dd-pos-rank { color: var(--pos-pk); }

.dd-pos-body { padding: 8px; }
.dd-pos-row {
  display: grid;
  grid-template-columns: 32px 1fr auto auto;
  gap: 8px; align-items: center;
  padding: 6px 8px;
  border-radius: 8px;
  font-size: 12px;
}
.dd-pos-row + .dd-pos-row { margin-top: 2px; }
.dd-pos-row:hover { background: var(--bg-3); }
.dd-pos-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg-3);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
  color: var(--ink-2);
  overflow: hidden;
  flex-shrink: 0;
}
.dd-pos-avatar img { width: 100%; height: 100%; object-fit: cover; }
.dd-pos-name {
  font-size: 12px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dd-pos-val {
  font-size: 11px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  min-width: 36px; text-align: right;
}
.dd-pos-rk-pill {
  font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px;
  min-width: 30px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.rk-good { background: var(--rank-good); color: var(--rank-good-ink); }
.rk-mid  { background: var(--rank-mid);  color: var(--rank-mid-ink); }
.rk-bad  { background: var(--rank-bad);  color: var(--rank-bad-ink); }

.dd-pick-row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 8px; align-items: center;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
}
.dd-pick-row + .dd-pick-row { margin-top: 2px; }
.dd-pick-row:hover { background: var(--bg-3); }
.dd-pick-icon {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  font-size: 14px;
}

.dd-entry-screen {
  display: flex; flex-direction: column; align-items: center;
  padding: 60px 20px 40px;
}
.dd-entry-screen h2 { margin: 0 0 6px; font-size: 18px; }
.dd-entry-screen p { margin: 0 0 24px; color: var(--ink-3); font-size: 13px; }
.dd-entry-row { display: flex; gap: 8px; }
.dd-entry-row .dd-input { width: 200px; }

.dd-league-picker { padding: 0; }
.dd-league-picker-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0 10px;
}
.dd-league-picker-header h3 { margin: 0; font-size: 15px; }
.dd-league-grid { display: flex; flex-direction: column; gap: 8px; }
.dd-league-card {
  background: var(--bg-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px;
  cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
  box-shadow: var(--shadow-sm);
}
.dd-league-card:hover { border-color: var(--pos-rb); box-shadow: 0 0 0 2px rgba(99,179,237,.15); }
.dd-league-card-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.dd-league-card-meta { font-size: 12px; color: var(--ink-3); }

.dd-empty-state {
  text-align: center; padding: 80px 20px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  color: var(--ink-2); box-shadow: var(--shadow-sm);
}
.dd-empty-state .dim { color: var(--ink-3); font-size: 13px; margin-top: 8px; }

/* Tablet / small laptop: collapse stats below the bar but keep bars left-aligned */
@media (max-width: 1100px) {
  .dd-root { padding: 24px 22px; }
  .dd-pos-grid { grid-template-columns: repeat(2, 1fr); }
  .dd-rank-row {
    grid-template-columns: 48px minmax(140px,1fr) minmax(180px,2fr);
    row-gap: 10px;
  }
  .dd-rank-stats {
    grid-column: 1 / -1;
    grid-template-columns: 78px 96px 78px 84px;
    justify-content: start;
  }
}
/* Phones */
@media (max-width: 720px) {
  .dd-root { padding: 14px; }
  .dd-header {
    flex-direction: column; align-items: stretch;
    padding-bottom: 14px; margin-bottom: 16px;
  }
  .dd-brand-title { font-size: 22px; }
  .dd-brand-mark { width: 44px; height: 44px; font-size: 22px; border-radius: 12px; }
  .dd-controls { width: 100%; flex-wrap: wrap; }
  .dd-input { flex: 1 1 100%; width: auto; }
  .dd-btn { flex: 1 1 auto; padding: 11px 16px; }
  .dd-meta { gap: 14px 22px; padding: 12px 16px; }
  .dd-pos-grid { grid-template-columns: 1fr; gap: 10px; }
  .dd-section { font-size: 16px; flex-wrap: wrap; }
  .dd-section-legend { gap: 8px; }
  .dd-rank-list { border-radius: 12px; }
  .dd-rank-row {
    padding: 12px 14px;
    gap: 12px;
    grid-template-columns: 36px minmax(0,1fr);
    row-gap: 8px;
  }
  .dd-rank-num { font-size: 18px; }
  .dd-rank-team-name { font-size: 13px; }
  .dd-bar-track { grid-column: 1 / -1; }
  .dd-rank-stats {
    grid-column: 1 / -1;
    grid-template-columns: 1fr 1fr;
    gap: 6px 14px;
    font-size: 11px;
  }
  .dd-rank-tier { justify-self: start; }
  .dd-strip-wrap { padding: 14px 14px 16px; border-radius: 14px; }
  .dd-strip-head { flex-wrap: wrap; gap: 8px; }
  .dd-pchip { flex: 0 0 110px; }
  .dd-pchip-img-wrap { height: 92px; }
}
/* Small phones (iPhone SE / mini) */
@media (max-width: 380px) {
  .dd-root { padding: 12px; }
  .dd-brand { gap: 10px; }
  .dd-brand-title { font-size: 20px; }
  .dd-rank-stats { grid-template-columns: 1fr 1fr; }
  .dd-rank-tier { grid-column: 1 / -1; justify-self: start; }
}

/* ========== Sticky compact header ========== */
.dd-header--sticky {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  align-items: center;
  padding-bottom: 12px; margin-bottom: 14px;
  margin-left: -36px; margin-right: -36px;
  padding-left: 36px; padding-right: 36px;
}
.dd-compact-meta { flex: 1; min-width: 0; }
.dd-compact-league {
  font-size: 15px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dd-compact-detail { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
.dd-btn-ghost {
  background: none; border: none; cursor: pointer;
  color: var(--ink-3); font-size: 12px; padding: 9px 8px;
  font-family: inherit;
}
.dd-btn-ghost:hover { color: var(--ink); }

/* ========== Pull-to-refresh indicator ========== */
.dd-pull-indicator {
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-3); font-size: 12px; font-weight: 500; overflow: hidden;
}

/* ========== Position bar tap tooltip ========== */
.dd-bar-tip {
  font-size: 11px; font-weight: 600; margin-top: 5px;
  display: flex; flex-wrap: wrap; gap: 6px;
}

@media (max-width: 1100px) {
  .dd-header--sticky { margin-left: -22px; margin-right: -22px; padding-left: 22px; padding-right: 22px; }
}
@media (max-width: 720px) {
  .dd-header--sticky { flex-direction: row; margin-left: -14px; margin-right: -14px; padding-left: 14px; padding-right: 14px; }
  .dd-compact-detail { display: none; }
}
@media (max-width: 380px) {
  .dd-header--sticky { margin-left: -12px; margin-right: -12px; padding-left: 12px; padding-right: 12px; }
}

/* ========== Tab Navigation ========== */
.dd-tabs {
  display: flex; gap: 2px;
  background: var(--bg-3);
  padding: 3px; border-radius: 12px;
  margin-bottom: 20px; width: fit-content;
}
.dd-tab {
  padding: 8px 20px; font-size: 13px; font-weight: 600;
  border-radius: 10px; border: none; cursor: pointer;
  background: none; color: var(--ink-2);
  font-family: inherit; transition: background 0.12s, color 0.12s;
}
.dd-tab.active { background: var(--bg-2); color: var(--ink); box-shadow: var(--shadow-sm); }
.dd-tab:hover:not(.active) { color: var(--ink); }

@media (max-width: 720px) {
  .dd-tabs { width: 100%; }
  .dd-tab { flex: 1; text-align: center; padding: 8px 10px; }
}

/* ========== KTC Rankings ========== */
.dd-ktc-filter {
  display: flex; gap: 2px; background: var(--bg-3);
  padding: 3px; border-radius: 10px;
}
.dd-ktc-filter-btn {
  padding: 6px 13px; font-size: 12px; font-weight: 700;
  border-radius: 8px; border: none; cursor: pointer;
  background: none; color: var(--ink-2);
  font-family: inherit; transition: background 0.1s, color 0.1s;
  letter-spacing: 0.03em;
}
.dd-ktc-filter-btn.active { background: var(--bg-2); color: var(--ink); box-shadow: var(--shadow-sm); }
.dd-ktc-filter-btn:hover:not(.active) { color: var(--ink); }
.dd-ktc-spacer { flex: 1; min-width: 8px; }
.dd-ktc-controls {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin-bottom: 16px;
}
.dd-ktc-search {
  background: var(--bg-2); border: 1px solid var(--line);
  color: var(--ink); padding: 8px 14px;

<script type="module">
import React, { useState, useMemo, useEffect, useRef } from "react";
import { createRoot } from "react-dom/client";

const e = React.createElement;
const fmt = (n) => (typeof n === "number" ? Math.round(n).toLocaleString() : "—");

const POS_COLORS = {
  QB: { hex: "#10b981" },
  RB: { hex: "#3b82f6" },
  WR: { hex: "#ec4899" },
  TE: { hex: "#a855f7" },
  PICKS: { hex: "#f59e0b" }
};

function rebuildScore(age, pos) {
  if (!age) return 0.5;
  const peakByPos = { QB: 30, RB: 25, WR: 27, TE: 28 };
  const peak = peakByPos[pos] || 27;
  if (age <= peak - 4) return 0.95;
  if (age <= peak - 2) return 0.8;
  if (age <= peak) return 0.6;
  if (age <= peak + 2) return 0.4;
  if (age <= peak + 4) return 0.2;
  return 0.05;
}

function normName(s) {
  return (s || "").toLowerCase()
    .replace(/[^a-z0-9 ]/g, "")
    .replace(/\b(jr|sr|ii|iii|iv)\b/g, "")
    .replace(/\s+/g, " ").trim();
}

function shortName(name) {
  if (!name) return "";
  const parts = name.split(" ");
  if (parts.length === 1) return parts[0];
  return parts[0][0] + ". " + parts.slice(1).join(" ");
}

function initials(name) {
  if (!name) return "?";
  const parts = name.split(" ").filter(Boolean);
  if (parts.length === 1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function slotMatches(slot, pos) {
  if (!pos) return false;
  if (slot === pos) return true;
  if (slot === "FLEX") return ["RB", "WR", "TE"].includes(pos);
  if (slot === "SUPER_FLEX" || slot === "SUPERFLEX")
    return ["QB", "RB", "WR", "TE"].includes(pos);
  if (slot === "REC_FLEX") return ["WR", "TE"].includes(pos);
  if (slot === "WRRB_FLEX" || slot === "WRRB") return ["RB", "WR"].includes(pos);
  return false;
}

function pickStarters(playerIds, valueMap, rosterPositions) {
  const slots = (rosterPositions || []).filter(
    (p) => p !== "BN" && p !== "TAXI" && p !== "IR"
  );
  const pool = playerIds.map((id) => valueMap[id]).filter(Boolean)
    .sort((a, b) => b.value - a.value);
  const used = new Set();
  const starters = [];
  let totalStarterValue = 0;
  for (const slot of slots) {
    let pick = null;
    for (const p of pool) {
      if (used.has(p.id)) continue;
      if (slotMatches(slot, p.position)) { pick = p; break; }
    }
    if (pick) {
      used.add(pick.id);
      starters.push({ slot, ...pick });
      totalStarterValue += pick.value;
    } else {
      starters.push({ slot, empty: true });
    }
  }
  const benchIds = playerIds.filter((id) => !used.has(id));
  const bench = benchIds
    .map((id) => valueMap[id])
    .filter(Boolean)
    .sort((a, b) => b.value - a.value);
  return { starters, bench, totalStarterValue };
}

const PICK_TIERS = ['early', 'mid', 'late'];
const PICK_TIER_LABELS = { early: 'Early', mid: 'Mid', late: 'Late' };
const PICK_VALUE_TABLE = {
  sf: {
    1: { early: 6500, mid: 5500, late: 4500 },
    2: { early: 3000, mid: 2400, late: 1900 },
    3: { early: 1200, mid:  900, late:  650 },
    4: { early:  500, mid:  350, late:  250 }
  },
  nsf: {
    1: { early: 5000, mid: 4200, late: 3400 },
    2: { early: 2100, mid: 1700, late: 1350 },
    3: { early:  800, mid:  600, late:  450 },
    4: { early:  300, mid:  200, late:  140 }
  }
};
function approxPickValue(season, round, currentSeason, isSF, tier) {
  const yearsOut = Math.max(0, season - currentSeason);
  const t = tier && PICK_TIERS.includes(tier) ? tier : 'mid';
  const row = (isSF ? PICK_VALUE_TABLE.sf : PICK_VALUE_TABLE.nsf)[round];
  const v = row ? (row[t] ?? row.mid) : 100;
  return Math.round(v * Math.pow(0.85, yearsOut));
}

function rankClass(rank, total) {
  if (!rank || !total) return "rk-mid";
  const p = rank / total;
  if (p <= 0.25) return "rk-good";
  if (p <= 0.6)  return "rk-mid";
  return "rk-bad";
}

function tierFor(rank, total) {
  if (rank === 1) return { label: "Dynasty", cls: "rk-good" };
  if (rank <= 3)  return { label: "Contender",  cls: "rk-good" };
  if (rank <= Math.ceil(total / 2)) return { label: "Riser", cls: "rk-mid" };
  if (rank <= total - 2) return { label: "Pretender", cls: "rk-bad" };
  return { label: "Rebuilder", cls: "rk-bad" };
}

const TIER_BORDER = { 'rk-good': '#117a3a', 'rk-mid': '#8a6b13', 'rk-bad': '#a02828' };

}

function DynastyAnalyzer() {
  const [username, setUsername] = useState("");
  const [sleeperUser, setSleeperUser] = useState(null);
  const [userLeagues, setUserLeagues] = useState([]);
  const [leagueId, setLeagueId] = useState('');
  const [loading, setLoading] = useState(false);
  const [stage, setStage] = useState("");
  const [error, setError] = useState("");
  const [league, setLeague] = useState(null);
  const [users, setUsers] = useState([]);
  const [rosters, setRosters] = useState([]);
  const [valueMap, setValueMap] = useState({});
  const [redraftValueMap, setRedraftValueMap] = useState({});
  const [sleeperPlayers, setSleeperPlayers] = useState({});
  const [valueSource, setValueSource] = useState("");
  const [redraftValueSource, setRedraftValueSource] = useState("");
  const [tradedPicks, setTradedPicks] = useState([]);
  const [activeTeamId, setActiveTeamId] = useState(null);
  const [myTeamId, setMyTeamId] = useState(null);
  const [barTip, setBarTip] = useState(null);
  const [showChangeInput, setShowChangeInput] = useState(false);
  const [pullProgress, setPullProgress] = useState(0);
  const [activeView, setActiveView] = useState('rankings');
  const [ktcPos, setKtcPos] = useState('ALL');
  const [ktcShowAvailable, setKtcShowAvailable] = useState(false);
  const [ktcShowMyTeam, setKtcShowMyTeam] = useState(false);
  const [ktcSearch, setKtcSearch] = useState('');
  const [tradeTeams, setTradeTeams] = useState([]);
  const [tradeAssets, setTradeAssets] = useState([]);
  const [tradePickerOpen, setTradePickerOpen] = useState({});
  const [tradePickerSearch, setTradePickerSearch] = useState({});
  const [pickTiers, setPickTiers] = useState({});
  const doLoadRef = useRef(null);
  const leagueRef = useRef(null);

  const isSuperflex = useMemo(() => {
    const slots = league?.roster_positions || [];
    return slots.includes("SUPER_FLEX") || slots.includes("SUPERFLEX");
  }, [league]);

  async function loadLeague(lid, forceKtc) {
    const targetId = lid || leagueId;
    if (lid) setLeagueId(lid);
    setShowChangeInput(false);
    setError(""); setLoading(true);
    setLeague(null); setRosters([]); setUsers([]); setValueMap({}); setRedraftValueMap({}); setSleeperPlayers({});
    setActiveTeamId(null); setMyTeamId(null);
    try {
      setStage("Pulling league settings…");
      const lg = await fetch(`https://api.sleeper.app/v1/league/${targetId}`).then(r => {
        if (!r.ok) throw new Error("League not found — check the ID");
        return r.json();
      });
      setLeague(lg);

      setStage("Pulling rosters & users…");
      const [rs, us, picks] = await Promise.all([
        fetch(`https://api.sleeper.app/v1/league/${targetId}/rosters`).then(r => r.json()),
        fetch(`https://api.sleeper.app/v1/league/${targetId}/users`).then(r => r.json()),
        fetch(`https://api.sleeper.app/v1/league/${targetId}/traded_picks`)
          .then(r => r.ok ? r.json() : []).catch(() => [])
      ]);
      setRosters(rs || []); setUsers(us || []); setTradedPicks(picks || []);

      setStage("Pulling Sleeper player metadata (~5MB, one-time)…");
      const players = await fetch("https://api.sleeper.app/v1/players/nfl").then(r => r.json());
      setSleeperPlayers(players);

      setStage("Pulling KeepTradeCut dynasty values…");
      const sf = lg.roster_positions?.includes("SUPER_FLEX") || lg.roster_positions?.includes("SUPERFLEX");
      const vm = await loadValues(players, sf, forceKtc);
      setValueMap(vm.map);
      setValueSource(vm.source);

      setStage("Pulling KeepTradeCut redraft values…");
      const rvm = await loadRedraftValues(players, sf, forceKtc);
      setRedraftValueMap(rvm.map);
      setRedraftValueSource(rvm.source || "");

      if (sleeperUser) {
        const myRoster = (rs || []).find(r => r.owner_id === sleeperUser.user_id);
        if (myRoster) {
          setActiveTeamId(myRoster.roster_id);
          setMyTeamId(myRoster.roster_id);
        }
      }
      setStage("");
    } catch (err) {
      setError(err.message || "Something broke. Check the league ID.");
      setStage("");
    } finally {
      setLoading(false);
    }
  }

  async function loadUser() {
    setError(""); setLoading(true);
    setSleeperUser(null); setUserLeagues([]);
    try {
      setStage("Looking up Sleeper user…");
      const user = await fetch(`https://api.sleeper.app/v1/user/${username.trim()}`).then(r => {
        if (!r.ok) throw new Error("User not found — check your Sleeper username");
        return r.json();
      });
      if (!user?.user_id) throw new Error("User not found — check your Sleeper username");
      setSleeperUser(user);

      setStage("Loading your leagues…");
      const curYear = new Date().getFullYear();
      const [lgCur, lgPrev] = await Promise.all([
        fetch(`https://api.sleeper.app/v1/user/${user.user_id}/leagues/nfl/${curYear}`).then(r => r.json()).catch(() => []),
        fetch(`https://api.sleeper.app/v1/user/${user.user_id}/leagues/nfl/${curYear - 1}`).then(r => r.json()).catch(() => []),
      ]);
      const seen = new Set();
      const all = [];
      for (const lg of [...(lgCur || []), ...(lgPrev || [])]) {
        if (!seen.has(lg.league_id)) { seen.add(lg.league_id); all.push(lg); }
      }
      setUserLeagues(all);
      setStage("");
    } catch (err) {
      setError(err.message || "Couldn't find that user.");
      setStage("");
    } finally {
      setLoading(false);
    }
  }

  async function fetchKtcPlayersArray(force, kind = 'dynasty') {
    // KTC embeds the live rankings as `var playersArray = [...]` inside the
    // /dynasty-rankings or /fantasy-rankings HTML page. There's no public JSON
    // API, and the page blocks cross-origin fetches, so we go through a CORS
    // proxy chain.
    const isRedraft = kind === 'redraft';
    const cacheKey = isRedraft ? 'ktc_redraft_cache' : 'ktc_rankings_cache';
    const target = isRedraft
      ? "https://keeptradecut.com/fantasy-rankings/"
      : "https://keeptradecut.com/dynasty-rankings/";
    const label = isRedraft ? 'KeepTradeCut redraft' : 'KeepTradeCut dynasty';

    // Return cached data if fetched within the last 24 hours (skipped on manual refresh)
    if (!force) {
      try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          const { ts, data } = JSON.parse(cached);
          if (Date.now() - ts < 86400000 && Array.isArray(data) && data.length > 100) return data;
        }
      } catch (_) {}
    }

    const proxies = [
      { name: "corsproxy.io",   url: (u) => `https://corsproxy.io/?${encodeURIComponent(u)}` },
      { name: "allorigins.win", url: (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },
      { name: "codetabs.com",   url: (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}` },
      { name: "thingproxy",     url: (u) => `https://thingproxy.freeboard.io/fetch/${u}` }
    ];
    for (const { name, url: make } of proxies) {
      setStage(`Pulling ${label} values via ${name}…`);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      try {
        const res = await fetch(make(target), { signal: ctrl.signal });
        if (!res.ok) continue;
        const html = await res.text();
        const idx = html.indexOf("var playersArray");
        if (idx < 0) continue;
        const start = html.indexOf("[", idx);
        if (start < 0) continue;
        // Walk bracket depth so we don't trip on `]` inside string values.
        let depth = 0, inStr = null, esc = false, end = -1;
        for (let i = start; i < html.length; i++) {
          const c = html[i];
          if (esc) { esc = false; continue; }
          if (inStr) {
            if (c === "\\") { esc = true; continue; }
            if (c === inStr) inStr = null;
            continue;
          }
          if (c === '"' || c === "'") { inStr = c; continue; }
          if (c === "[") depth++;
          else if (c === "]") { depth--; if (depth === 0) { end = i; break; } }
        }
        if (end < 0) continue;
        const literal = html.slice(start, end + 1);
        let data;
        try { data = JSON.parse(literal); }
        catch (_) { data = Function('"use strict"; return (' + literal + ')')(); }
        if (Array.isArray(data) && data.length > 100) {
          try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data })); } catch (_) {}
          return data;
        }
      } catch (_) {}
      finally { clearTimeout(timer); }
    }
    return null;
  }

  async function loadValues(players, sf, forceKtc) {
    const ktcData = await fetchKtcPlayersArray(forceKtc, 'dynasty');
    if (ktcData) {
      const map = mergeValues(players, ktcData, "ktc", sf);
      if (Object.values(map).some(p => p.value > 0)) {
        return { map, source: "KeepTradeCut (live)" };
      }
    }
    try {
      const res = await fetch(`https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=${sf ? 2 : 1}&numTeams=12&ppr=1`);
      const data = await res.json();
      const map = mergeValues(players, data, "fc", sf);
      return { map, source: "FantasyCalc (KTC unreachable)" };
    } catch (e2) {
      throw new Error("Couldn't load player values from KTC or FantasyCalc.");
    }
  }

  async function loadRedraftValues(players, sf, forceKtc) {
    const ktcData = await fetchKtcPlayersArray(forceKtc, 'redraft');
    if (ktcData) {
      const map = mergeValues(players, ktcData, "ktc", sf);
      if (Object.values(map).some(p => p.value > 0)) {
        return { map, source: "KeepTradeCut redraft (live)" };
      }
    }
    try {
      const res = await fetch(`https://api.fantasycalc.com/values/current?isDynasty=false&numQbs=${sf ? 2 : 1}&numTeams=12&ppr=1`);
      const data = await res.json();
      const map = mergeValues(players, data, "fc", sf);
      return { map, source: "FantasyCalc redraft (KTC unreachable)" };
    } catch (e2) {
      return { map: {}, source: null };
    }
  }

  function mergeValues(players, valueData, source, sf) {
    const byName = {};
    if (source === "ktc") {
      for (const row of valueData || []) {
        const vals = sf
          ? (row.superflexValues ?? row.oneQBValues)
          : (row.oneQBValues ?? row.superflexValues);
        const v = vals?.value;
        if (!v) continue;
        byName[normName(row.playerName)] = { value: v, trend: vals?.overallTrend ?? null, position: row.position, name: row.playerName };
      }
    } else {
      const list = valueData?.players || valueData || [];
      for (const row of list) {
        const v = row.value;
        const name = row.player?.name || row.name;
        const pos = row.player?.position || row.position;
        if (!v || !name) continue;
        byName[normName(name)] = { value: v, trend: row.trend30Day ?? null, position: pos, name };
      }
    }
    const map = {};
    for (const [pid, p] of Object.entries(players || {})) {
      if (!p?.full_name) continue;
      const hit = byName[normName(p.full_name)];
      // Only use hit when positions agree — prevents e.g. "Kenneth Walker" (WR in Sleeper)
      // from stealing the value of "Kenneth Walker III" (RB) due to suffix stripping
      const posMatch = !hit?.position || !p.position || hit.position === p.position;
      map[pid] = {
        id: pid, name: p.full_name, position: p.position,
        team: p.team, age: p.age,
        value: (hit && posMatch) ? hit.value : 0,
        trend: (hit && posMatch) ? (hit?.trend ?? null) : null
      };
    }
    return map;
  }

  // Build league-wide position ranks (across all rostered players in this league)
  const leaguePosRanks = useMemo(() => {
    if (!rosters.length || !Object.keys(valueMap).length) return {};
    const byPos = { QB: [], RB: [], WR: [], TE: [] };
    const rosteredIds = new Set();
    for (const r of rosters) for (const id of (r.players || [])) rosteredIds.add(id);
    for (const id of rosteredIds) {
      const p = valueMap[id];
      if (!p || !p.position || !byPos[p.position]) continue;
      byPos[p.position].push(p);
    }
    const ranks = {};
    for (const pos of Object.keys(byPos)) {
      byPos[pos].sort((a, b) => b.value - a.value);
      byPos[pos].forEach((p, i) => { ranks[p.id] = i + 1; });
    }
    return ranks;
  }, [rosters, valueMap]);

  const teamCards = useMemo(() => {
    if (!league || !rosters.length || !Object.keys(valueMap).length) return [];
    const leagueSeason = parseInt(league.season || `${new Date().getFullYear()}`, 10);
    const currentSeason = league.status === 'complete' ? leagueSeason + 1 : leagueSeason;
    const sf = isSuperflex;

    function picksForRoster(rosterId) {
      const seasons = [currentSeason + 1, currentSeason + 2];
      const allPicks = [];
      for (const s of seasons) {
        for (let r = 1; r <= 4; r++) {
          for (const ros of rosters) {
            allPicks.push({ season: s, round: r, original: ros.roster_id, owner: ros.roster_id });
          }
        }
      }
      for (const t of tradedPicks) {
        const pick = allPicks.find(p =>
          p.season === parseInt(t.season, 10) &&
          p.round === t.round &&
          p.original === t.roster_id
        );
        if (pick) pick.owner = t.owner_id;
      }
      return allPicks.filter(p => p.owner === rosterId).map(p => ({
        ...p,
        value: approxPickValue(p.season, p.round, currentSeason, sf),
        label: `${p.season} R${p.round}${p.original !== rosterId ? " (via trade)" : ""}`
      }));
    }

    return rosters.map(r => {
      const playerIds = r.players || [];
      const owned = playerIds.map(id => valueMap[id]).filter(p => p && p.value > 0);
      const totalValue = owned.reduce((a, b) => a + b.value, 0);
      const ageList = owned.filter(p => p.age);
      const avgAge = ageList.length ? ageList.reduce((a, b) => a + b.age, 0) / ageList.length : 0;
      const { starters, bench, totalStarterValue } = pickStarters(playerIds, valueMap, league.roster_positions);
      const youngScore = owned.reduce(
        (acc, p) => acc + p.value * rebuildScore(p.age, p.position), 0
      ) / (totalValue || 1);
      const picks = picksForRoster(r.roster_id);
      const pickValue = picks.reduce((a, b) => a + b.value, 0);
      const user = users.find(u => u.user_id === r.owner_id);

      // Position breakdown for this team
      const byPos = { QB: [], RB: [], WR: [], TE: [] };
      for (const p of owned) {
        if (byPos[p.position]) byPos[p.position].push(p);
      }
      const posValues = {};
      for (const pos of Object.keys(byPos)) {
        byPos[pos].sort((a, b) => b.value - a.value);
        posValues[pos] = byPos[pos].reduce((a, p) => a + p.value, 0);
      }
      posValues.PICKS = pickValue;

      return {
        id: r.roster_id,
        owner: user?.display_name || `Team ${r.roster_id}`,
        teamName: user?.metadata?.team_name || user?.display_name || `Team ${r.roster_id}`,
        avatar: user?.avatar,
        totalValue, totalStarterValue, pickValue,
        combinedValue: totalValue + pickValue,
        avgAge, youngScore,
        wins: r.settings?.wins || 0,
        losses: r.settings?.losses || 0,
        ties: r.settings?.ties || 0,
        pointsFor: ((r.settings?.fpts || 0) + (r.settings?.fpts_decimal || 0) / 100),
        pointsAgainst: ((r.settings?.fpts_against || 0) + (r.settings?.fpts_against_decimal || 0) / 100),
        streak: r.metadata?.streak || "",
        starters, bench,
        roster: owned.sort((a, b) => b.value - a.value),
        byPos,
        posValues,
        picks: picks.sort((a, b) => a.season - b.season || a.round - b.round)
      };
    }).sort((a, b) => b.combinedValue - a.combinedValue);
  }, [league, rosters, users, valueMap, tradedPicks, isSuperflex]);

  // Compute team rank within each position group
  const posRankings = useMemo(() => {
    const out = {};
    for (const pos of ["QB", "RB", "WR", "TE", "PICKS"]) {
      const sorted = [...teamCards].sort((a, b) => (b.posValues[pos] || 0) - (a.posValues[pos] || 0));
      sorted.forEach((t, i) => {
        out[t.id] = out[t.id] || {};
        out[t.id][pos] = i + 1;
      });
    }
    return out;
  }, [teamCards]);

  // ===== Current-season (redraft) rankings — picks excluded =====
  const redraftLeaguePosRanks = useMemo(() => {
    if (!rosters.length || !Object.keys(redraftValueMap).length) return {};
    const byPos = { QB: [], RB: [], WR: [], TE: [] };
    const rosteredIds = new Set();
    for (const r of rosters) for (const id of (r.players || [])) rosteredIds.add(id);
    for (const id of rosteredIds) {
      const p = redraftValueMap[id];
      if (!p || !p.position || !byPos[p.position]) continue;
      byPos[p.position].push(p);
    }
    const ranks = {};
    for (const pos of Object.keys(byPos)) {
      byPos[pos].sort((a, b) => b.value - a.value);
      byPos[pos].forEach((p, i) => { ranks[p.id] = i + 1; });
    }
    return ranks;
  }, [rosters, redraftValueMap]);

  const redraftTeamCards = useMemo(() => {
    if (!league || !rosters.length || !Object.keys(redraftValueMap).length) return [];
    return rosters.map(r => {
      const playerIds = r.players || [];
      const owned = playerIds.map(id => redraftValueMap[id]).filter(p => p && p.value > 0);
      const totalValue = owned.reduce((a, b) => a + b.value, 0);
      const ageList = owned.filter(p => p.age);
      const avgAge = ageList.length ? ageList.reduce((a, b) => a + b.age, 0) / ageList.length : 0;
      const { starters, bench, totalStarterValue } = pickStarters(playerIds, redraftValueMap, league.roster_positions);
      const user = users.find(u => u.user_id === r.owner_id);

      // Depth: top bench players with diminishing weight per rank.
      // Starters dominate the ranking; depth provides a smaller tiebreaker
      // that rewards teams able to survive byes/injuries.
      const DEPTH_PLAYERS = 6;
      const DEPTH_DECAY = 0.75;
      let depthValue = 0;
      for (let k = 0; k < Math.min(DEPTH_PLAYERS, bench.length); k++) {
        depthValue += bench[k].value * Math.pow(DEPTH_DECAY, k);
      }
      const DEPTH_WEIGHT = 0.35;
      const combinedValue = totalStarterValue + depthValue * DEPTH_WEIGHT;

      const byPos = { QB: [], RB: [], WR: [], TE: [] };
      for (const p of owned) {
        if (byPos[p.position]) byPos[p.position].push(p);
      }
      const posValues = {};
      for (const pos of Object.keys(byPos)) {
        byPos[pos].sort((a, b) => b.value - a.value);
        posValues[pos] = byPos[pos].reduce((a, p) => a + p.value, 0);
      }

      return {
        id: r.roster_id,
        owner: user?.display_name || `Team ${r.roster_id}`,
        teamName: user?.metadata?.team_name || user?.display_name || `Team ${r.roster_id}`,
        avatar: user?.avatar,
        totalValue, totalStarterValue, depthValue,
        combinedValue,
        avgAge,
        wins: r.settings?.wins || 0,
        losses: r.settings?.losses || 0,
        ties: r.settings?.ties || 0,
        pointsFor: ((r.settings?.fpts || 0) + (r.settings?.fpts_decimal || 0) / 100),
        pointsAgainst: ((r.settings?.fpts_against || 0) + (r.settings?.fpts_against_decimal || 0) / 100),
        streak: r.metadata?.streak || "",
        starters, bench,
        roster: owned.sort((a, b) => b.value - a.value),
        byPos,
        posValues
      };
    }).sort((a, b) => b.combinedValue - a.combinedValue);
  }, [league, rosters, users, redraftValueMap]);

  const redraftPosRankings = useMemo(() => {
    const out = {};
    for (const pos of ["QB", "RB", "WR", "TE"]) {
      const sorted = [...redraftTeamCards].sort((a, b) => (b.posValues[pos] || 0) - (a.posValues[pos] || 0));
      sorted.forEach((t, i) => {
        out[t.id] = out[t.id] || {};
        out[t.id][pos] = i + 1;
      });
    }
    return out;
  }, [redraftTeamCards]);

  // ===== Trade Calculator =====
  const pickKey = (p) => `k:${p.season}:${p.round}:${p.original}`;
  const playerKey = (id) => `p:${id}`;

  // Initialize trade with my team + top opposing team when league loads
  useEffect(() => {
    if (teamCards.length >= 2 && tradeTeams.length === 0) {
      const firstId = myTeamId || teamCards[0].id;
      const secondId = teamCards.find(t => t.id !== firstId)?.id;
      if (firstId && secondId) setTradeTeams([firstId, secondId]);
    }
  }, [teamCards, myTeamId]);

  // Clear trade when league changes
  useEffect(() => {
    setTradeAssets([]);
    setTradeTeams([]);
    setTradePickerOpen({});
    setTradePickerSearch({});
    setPickTiers({});
  }, [league?.league_id]);

  const currentSeasonForPicks = useMemo(() => {
    if (!league) return new Date().getFullYear();
    const ls = parseInt(league.season || `${new Date().getFullYear()}`, 10);
    return league.status === 'complete' ? ls + 1 : ls;
  }, [league]);

  const valueOfPick = (p) => {
    const k = pickKey(p);
    const tier = pickTiers[k] || 'mid';
    return approxPickValue(p.season, p.round, currentSeasonForPicks, isSuperflex, tier);
  };

  const assetValue = (a) => a.kind === 'pick' ? valueOfPick(a) : a.value;

  const tradeSim = useMemo(() => {
    if (!league || !teamCards.length) return null;
    const slots = league.roster_positions || [];

    const simTeams = teamCards.map(t => {
      if (!tradeTeams.includes(t.id)) {
        return {
          ...t, simChanged: false, sent: [], recv: [],
          prePickValue: t.pickValue,
          preCombinedValue: t.combinedValue
        };
      }
      const sent = tradeAssets.filter(a => a.from === t.id);
      const recv = tradeAssets.filter(a => a.to === t.id);

      const sentPlayerIds = new Set(
        sent.filter(a => a.kind === 'player').map(a => a.playerId)
      );
      const recvPlayerIds = recv.filter(a => a.kind === 'player').map(a => a.playerId);

      const origRoster = rosters.find(r => r.roster_id === t.id);
      const keptIds = (origRoster?.players || []).filter(id => !sentPlayerIds.has(id));
      const newPlayerIds = [...keptIds, ...recvPlayerIds];

      const sentPickKeys = new Set(sent.filter(a => a.kind === 'pick').map(a => a.key));
      const keptPicks = t.picks.filter(p => !sentPickKeys.has(pickKey(p)));
      const recvPicks = recv.filter(a => a.kind === 'pick').map(a => ({
        season: a.season, round: a.round, original: a.original,
        owner: t.id, value: valueOfPick(a),
        label: `${a.season} R${a.round} (via trade)`
      }));
      // Re-value kept picks under any tier overrides set on them.
      const keptPicksRevalued = keptPicks.map(p => ({ ...p, value: valueOfPick(p) }));
      const newPicks = [...keptPicksRevalued, ...recvPicks]
        .sort((a, b) => a.season - b.season || a.round - b.round);
      const newPickValue = newPicks.reduce((s, p) => s + (p.value || 0), 0);

      // Pre-trade pick value with tier overrides applied to picks currently in the trade.
      const prePickValue = t.picks.reduce((s, p) => s + valueOfPick(p), 0);
      const preCombinedValue = t.totalValue + prePickValue;

      const owned = newPlayerIds.map(id => valueMap[id]).filter(p => p && p.value > 0);
      const totalValue = owned.reduce((s, p) => s + p.value, 0);
      const { starters, bench, totalStarterValue } =
        pickStarters(newPlayerIds, valueMap, slots);

      const byPos = { QB: [], RB: [], WR: [], TE: [] };
      for (const p of owned) if (byPos[p.position]) byPos[p.position].push(p);
      const posValues = {};
      for (const pos of Object.keys(byPos)) {
        byPos[pos].sort((a, b) => b.value - a.value);
        posValues[pos] = byPos[pos].reduce((s, p) => s + p.value, 0);
      }
      posValues.PICKS = newPickValue;

      const sentValue = sent.reduce((s, a) => s + assetValue(a), 0);
      const recvValue = recv.reduce((s, a) => s + assetValue(a), 0);

      return {
        ...t, simChanged: true,
        totalValue, totalStarterValue,
        pickValue: newPickValue,
        combinedValue: totalValue + newPickValue,
        prePickValue, preCombinedValue,
        starters, bench, byPos, posValues,
        roster: owned.sort((a, b) => b.value - a.value),
        picks: newPicks,
        sent, recv, sentValue, recvValue,
        netValue: recvValue - sentValue
      };
    });

    const sortedSim = [...simTeams].sort((a, b) => b.combinedValue - a.combinedValue);
    const simRankById = {};
    sortedSim.forEach((t, i) => { simRankById[t.id] = i + 1; });

    return { teams: simTeams, byId: Object.fromEntries(simTeams.map(t => [t.id, t])), simRankById };
  }, [league, teamCards, tradeTeams, tradeAssets, valueMap, rosters, pickTiers, isSuperflex, currentSeasonForPicks]);

  const origRankById = useMemo(() => {
    const m = {};
    teamCards.forEach((t, i) => { m[t.id] = i + 1; });
    return m;
  }, [teamCards]);

  function addTradeAsset(fromId, asset) {
    const others = tradeTeams.filter(id => id !== fromId);
    const toId = others[0];
    if (!toId) return;
    setTradeAssets(prev => {
      if (prev.some(a => a.from === fromId && a.key === asset.key)) return prev;
      return [...prev, { ...asset, from: fromId, to: toId }];
    });
  }

  function removeTradeAsset(fromId, key) {
    setTradeAssets(prev => prev.filter(a => !(a.from === fromId && a.key === key)));
  }

  function setAssetTo(fromId, key, toId) {
    setTradeAssets(prev => prev.map(a =>
      (a.from === fromId && a.key === key) ? { ...a, to: toId } : a
    ));
  }

    const used = new Set(tradeTeams);
    const next = teamCards.find(t => !used.has(t.id));
    if (next) setTradeTeams(prev => [...prev, next.id]);
  }

  function removeTradeTeam(id) {
    const remaining = tradeTeams.filter(x => x !== id);
    setTradeTeams(remaining);
    setTradeAssets(prev => prev
      .filter(a => a.from !== id)
      .map(a => a.to === id ? { ...a, to: remaining[0] } : a)
    );
  }

    if (tradeTeams.includes(newId)) return;
    const oldId = tradeTeams[idx];
    setTradeTeams(prev => prev.map((x, i) => i === idx ? newId : x));
    setTradeAssets(prev => prev.filter(a => a.from !== oldId && a.to !== oldId));

                    const cls = !lgRank ? 'rk-bad' :
                      lgRank <= (pos === 'TE' ? 12 : pos === 'QB' ? 12 : 24) ? 'rk-good' :
                      lgRank <= (pos === 'TE' ? 24 : pos === 'QB' ? 24 : 48) ? 'rk-mid' : 'rk-bad';
                    return e('div', { key: p.id, className: 'dd-pos-row' },
                      e(PlayerAvatar, { pid: p.id, name: p.name }),
                      e('div', { className: 'dd-pos-name' }, p.name),
                      e('div', { className: 'dd-pos-val' }, fmt(p.value)),
                      e('div', { className: 'dd-pos-rk-pill ' + cls }, lgRank || '—')
                    );
                  })
            )
          );
        })
      )
    ),

    // KTC Rankings view
    activeView === 'ktc-rankings' && league && !showChangeInput && (() => {
      let filtered = ktcRankedPlayers;
      if (ktcPos !== 'ALL') filtered = filtered.filter(p => p.position === ktcPos);
      if (ktcShowAvailable) filtered = filtered.filter(p => !p.roster);
      if (ktcShowMyTeam) filtered = filtered.filter(p => p.roster?.isMyTeam);
      if (ktcSearch.trim()) {
        const q = ktcSearch.trim().toLowerCase();
        filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
      }
      return e(React.Fragment, null,
        e('div', { className: 'dd-ktc-controls' },
          e('div', { className: 'dd-ktc-filter' },
            ['ALL', 'QB', 'RB', 'WR', 'TE'].map(pos =>
              e('button', {
                key: pos,
                className: 'dd-ktc-filter-btn' + (ktcPos === pos ? ' active' : ''),
                onClick: () => setKtcPos(pos)
              }, pos)
            )
          ),
          e('div', { className: 'dd-ktc-spacer' }),
          e('button', {
            className: 'dd-ktc-toggle-btn' + (ktcShowAvailable ? ' active' : ''),
            onClick: () => { setKtcShowAvailable(v => !v); setKtcShowMyTeam(false); }
          }, ktcShowAvailable ? '✓ Available Only' : 'Show Only Available'),
          myTeam && e('button', {
            className: 'dd-ktc-toggle-btn' + (ktcShowMyTeam ? ' active-mine' : ''),
            onClick: () => { setKtcShowMyTeam(v => !v); setKtcShowAvailable(false); }
          }, ktcShowMyTeam ? '★ My Team Only' : 'Show Only My Team'),
          e('input', {
            className: 'dd-ktc-search',
            type: 'text',
            placeholder: 'Search player…',
            value: ktcSearch,
            onChange: ev => setKtcSearch(ev.target.value)
          })
        ),
        e('div', { className: 'dd-ktc-table' },
          e('div', { className: 'dd-ktc-thead' },
            e('span', null, '#'),
            e('span', null, ''),
            e('span', null, 'Player'),
            e('span', { style: { textAlign: 'center' } }, 'Pos'),
            e('span', { style: { textAlign: 'right' } }, 'Value'),
            e('span', null, 'Roster Status')
          ),
          filtered.length === 0
            ? e('div', { style: { padding: '40px', textAlign: 'center', color: 'var(--ink-3)', fontSize: '13px' } }, 'No players match your filters.')
            : filtered.map((p, i) => {
                const isMyTeam = p.roster?.isMyTeam;
                const isOtherTeam = p.roster && !isMyTeam;
                const isUpgrade = ktcShowAvailable && !p.roster &&
                  myTeamMinValueByPosition[p.position] !== undefined &&
                  p.value > myTeamMinValueByPosition[p.position];
                const rowCls = isMyTeam ? ' my-team' : isOtherTeam ? ' other-team' : isUpgrade ? ' upgrade-available' : '';
                const statusEl = p.roster
                  ? (isMyTeam
                      ? e('span', { className: 'dd-ktc-status my-team-badge' }, '★ My Team')
                      : e('span', { className: 'dd-ktc-status other-team-badge' }, p.roster.name)
                    )
                  : e('span', { className: 'dd-ktc-status fa-badge' }, 'Free Agent');
                return e('div', { key: p.id, className: 'dd-ktc-row' + rowCls },
                  e('span', { className: 'dd-ktc-rank' }, i + 1),
                  e(KtcAvatar, { pid: p.id, name: p.name }),
                  e('div', null,
                    e('div', { className: 'dd-ktc-name' }, p.name),
                    e('div', { className: 'dd-ktc-detail' },
                      [p.nflTeam || 'FA', p.age ? p.age + ' yrs' : null].filter(Boolean).join(' · ')
                    )
                  ),
                  e('span', { className: 'dd-ktc-pos-pill', style: { background: POS_COLORS[p.position]?.hex || '#999' } }, p.position),
                  e('span', { className: 'dd-ktc-val' }, fmt(p.value)),
                  statusEl
                );
              })
        )
      );
    })(),

    // ===== Trade Calculator view =====
    activeView === 'trade-calc' && league && !showChangeInput && (() => {
      if (teamCards.length < 2 || !tradeSim) {
        return e('div', { className: 'dd-trade-empty-state' }, 'Loading rosters…');
      }
      const teamById = Object.fromEntries(teamCards.map(t => [t.id, t]));
      const isMultiWay = tradeTeams.length >= 3;

      const tierSelect = (a) => e('select', {
        className: 'dd-asset-to',
        value: pickTiers[a.key] || 'mid',
        onChange: ev => setPickTiers(prev => ({ ...prev, [a.key]: ev.target.value })),
        onClick: ev => ev.stopPropagation(),
        title: 'Assumed pick slot'
      }, PICK_TIERS.map(t =>
        e('option', { key: t, value: t }, PICK_TIER_LABELS[t])
      ));

      const renderAssetRow = (a, fromId) => {
        const colorPos = a.kind === 'player' ? a.position : 'PICKS';
        const liveVal = assetValue(a);
        return e('div', { key: a.key, className: 'dd-trade-asset' },
          e('span', {
            className: 'dd-asset-pos',
            style: { background: POS_COLORS[colorPos]?.hex || '#999' }
          }, a.kind === 'player' ? a.position : 'PK'),
          e('span', { className: 'dd-asset-name', title: a.label }, a.label),
          a.kind === 'pick' && tierSelect(a),
          e('span', { className: 'dd-asset-val' }, fmt(liveVal)),
          isMultiWay
            ? e('select', {
                className: 'dd-asset-to',
                value: a.to,
                onChange: ev => setAssetTo(fromId, a.key, parseInt(ev.target.value, 10)),
                title: 'Send to…'
              }, tradeTeams.filter(id => id !== fromId).map(id =>
                e('option', { key: id, value: id }, '→ ' + (teamById[id]?.teamName || 'Team ' + id))
              ))
            : e('span', { className: 'dd-asset-val' }, '→'),
          e('button', {
            className: 'dd-asset-x',
            onClick: () => removeTradeAsset(fromId, a.key),
            title: 'Remove'
          }, '×')
        );
      };

      const renderRecvRow = (a) => {
        const colorPos = a.kind === 'player' ? a.position : 'PICKS';
        const liveVal = assetValue(a);
        return e('div', { key: a.from + ':' + a.key, className: 'dd-trade-asset recv' },
          e('span', {
            className: 'dd-asset-pos',
            style: { background: POS_COLORS[colorPos]?.hex || '#999' }
          }, a.kind === 'player' ? a.position : 'PK'),
          e('span', { className: 'dd-asset-name', title: a.label },
            a.label,
            isMultiWay && e('span', { style: { color: 'var(--ink-3)', fontWeight: 400, marginLeft: '4px' } },
              'from ' + (teamById[a.from]?.teamName || 'Team ' + a.from))
          ),
          a.kind === 'pick' && tierSelect(a),
          e('span', { className: 'dd-asset-val' }, fmt(liveVal))
        );
      };

      return e(React.Fragment, null,
        // Team chips
        e('div', { className: 'dd-trade-teams' },
          tradeTeams.map((tid, idx) => {
            const t = teamById[tid];
            return e('div', { key: idx, className: 'dd-trade-team-chip' },
              e('span', { style: { color: 'var(--ink-3)', fontSize: '11px', fontWeight: 700 } }, 'Team ' + (idx + 1)),
              e('select', {
                value: tid,
                onChange: ev => changeTradeTeam(idx, parseInt(ev.target.value, 10))
              }, teamCards.map(tc =>
                e('option', {
                  key: tc.id, value: tc.id,
                  disabled: tradeTeams.includes(tc.id) && tc.id !== tid
                }, tc.teamName)
              )),
              tradeTeams.length > 2 && e('button', {
                className: 'dd-chip-x', onClick: () => removeTradeTeam(tid), title: 'Remove from trade'
              }, '×')
            );
          }),
          e('button', {
            className: 'dd-trade-add',
            onClick: addTradeTeam,
            disabled: tradeTeams.length >= teamCards.length
          }, '+ Add team'),
          tradeAssets.length > 0 && e('button', {
            className: 'dd-trade-reset', onClick: resetTrade
          }, 'Reset trade')
        ),

        // Top-line summary
        (() => {
          const participants = tradeTeams.map(id => tradeSim.byId[id]).filter(Boolean);
          const anyAssets = tradeAssets.length > 0;
          return e('div', { className: 'dd-trade-summary' },
            e('div', { className: 'dd-trade-summary-title' }, anyAssets ? 'Trade Outcome' : 'Pick assets below to simulate'),
            e('div', { className: 'dd-trade-summary-grid' },
              participants.map(p => {
                const net = p.netValue || 0;
                const cls = !anyAssets ? '' : net > 0 ? 'win' : net < 0 ? 'lose' : '';
                const deltaCls = net > 0 ? 'up' : net < 0 ? 'down' : 'even';
                const oldR = origRankById[p.id];
                const newR = tradeSim.simRankById[p.id];
                const rankDelta = oldR - newR;
                return e('div', { key: p.id, className: 'dd-trade-summary-team ' + cls },
                  e('div', null,
                    e('div', { className: 'dd-trade-summary-name' }, p.teamName),
                    e('div', { className: 'dd-trade-summary-sub' },
                      'Rank ' + oldR + ' → ' + newR,
                      rankDelta !== 0 && ' (' + (rankDelta > 0 ? '↑' : '↓') + Math.abs(rankDelta) + ')'
                    )
                  ),
                  e('div', { className: 'dd-trade-summary-delta ' + deltaCls },
                    (net > 0 ? '+' : '') + fmt(net)
                  )
                );
              })
            )
          );
        })(),

        // Per-team panels
        e('div', { className: 'dd-trade-grid' },
          tradeTeams.map(tid => {
            const base = teamById[tid];
            const sim = tradeSim.byId[tid];
            if (!base || !sim) return null;

            const pickerOpen = !!tradePickerOpen[tid];
            const pickerQuery = (tradePickerSearch[tid] || '').toLowerCase().trim();
            const inTradeKeys = new Set(
              tradeAssets.filter(a => a.from === tid).map(a => a.key)
            );

            // Available players & picks (their roster minus already-added)
            const availPlayers = base.roster
              .filter(p => !inTradeKeys.has(playerKey(p.id)))
              .filter(p => !pickerQuery || p.name.toLowerCase().includes(pickerQuery))
              .map(p => ({
                key: playerKey(p.id), kind: 'player', playerId: p.id,
                label: p.name, position: p.position, value: p.value
              }));
            const availPicks = base.picks
              .filter(p => !inTradeKeys.has(pickKey(p)))
              .filter(p => !pickerQuery || p.label.toLowerCase().includes(pickerQuery))
              .map(p => ({
                key: pickKey(p), kind: 'pick',
                label: p.label, value: p.value,
                season: p.season, round: p.round, original: p.original
              }));

            const sending = tradeAssets.filter(a => a.from === tid);
            const receiving = tradeAssets.filter(a => a.to === tid);

            const oldR = origRankById[tid];
            const newR = tradeSim.simRankById[tid];
            const rankDelta = oldR - newR;
            const rankDeltaCls = rankDelta > 0 ? 'delta-up' : rankDelta < 0 ? 'delta-down' : 'delta-even';

            const stats = [
              { k: 'Combined', pre: sim.preCombinedValue, post: sim.combinedValue },
              { k: 'Starters', pre: base.totalStarterValue, post: sim.totalStarterValue },
              { k: 'Picks',    pre: sim.prePickValue,     post: sim.pickValue }
            ];

            return e('div', { key: tid, className: 'dd-trade-panel' },
              // Head
              e('div', { className: 'dd-trade-panel-head' },
                e('div', null,
                  e('div', { className: 'dd-trade-panel-name' }, base.teamName),
                  e('div', { className: 'dd-trade-panel-owner' }, '@' + base.owner)
                ),
                e('div', { className: 'dd-trade-panel-rank' },
                  'Rank ', oldR, ' → ', newR, ' ',
                  rankDelta !== 0 && e('span', { className: rankDeltaCls },
                    rankDelta > 0 ? '↑' + rankDelta : '↓' + Math.abs(rankDelta)
                  )
                )
              ),

              // Sending
              e('div', { className: 'dd-trade-section' },
                e('div', { className: 'dd-trade-section-label' },
                  e('span', null, 'Sending'),
                  e('span', { className: 'dd-trade-section-tot' },
                    sending.length ? '−' + fmt(sim.sentValue) : '—')
                ),
                sending.length === 0
                  ? e('div', { className: 'dd-trade-empty' }, 'No assets selected')
                  : sending.map(a => renderAssetRow(a, tid))
              ),

              // Receiving
              e('div', { className: 'dd-trade-section' },
                e('div', { className: 'dd-trade-section-label' },
                  e('span', null, 'Receiving'),
                  e('span', { className: 'dd-trade-section-tot' },
                    receiving.length ? '+' + fmt(sim.recvValue) : '—')
                ),
                receiving.length === 0
                  ? e('div', { className: 'dd-trade-empty' }, 'No assets coming in')
                  : receiving.map(a => renderRecvRow(a))
              ),

              // Picker toggle
              e('button', {
                className: 'dd-trade-picker-toggle' + (pickerOpen ? ' active' : ''),
                onClick: () => setTradePickerOpen(prev => ({ ...prev, [tid]: !prev[tid] }))
              }, pickerOpen ? '− Hide assets' : '+ Add assets from this roster'),

              // Picker
              pickerOpen && e('div', { className: 'dd-trade-picker' },
                e('input', {
                  className: 'dd-trade-picker-search',
                  placeholder: 'Search player or pick…',
                  value: tradePickerSearch[tid] || '',
                  onChange: ev => setTradePickerSearch(prev => ({ ...prev, [tid]: ev.target.value }))
                }),
                (availPlayers.length + availPicks.length) === 0
                  ? e('div', { className: 'dd-trade-picker-empty' }, 'Nothing matches')
                  : [...availPlayers, ...availPicks].map(asset =>
                      e('div', {
                        key: asset.key, className: 'dd-trade-picker-row',
                        onClick: () => addTradeAsset(tid, asset)
                      },
                        e('span', {
                          className: 'dd-asset-pos',
                          style: { background: POS_COLORS[asset.kind === 'player' ? asset.position : 'PICKS']?.hex || '#999' }
                        }, asset.kind === 'player' ? asset.position : 'PK'),
                        e('span', { className: 'dd-asset-name', title: asset.label }, asset.label),
                        e('span', { className: 'dd-asset-val' }, fmt(asset.value))
                      )
                    )
              ),

              // Value stats with deltas
              e('div', { className: 'dd-trade-stats' },
                stats.map(s => {
                  const d = s.post - s.pre;
                  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'even';
                  return e('div', { key: s.k, className: 'dd-trade-stat' },
                    e('div', { className: 'dd-trade-stat-k' }, s.k),
                    e('div', { className: 'dd-trade-stat-v' }, fmt(s.post)),
                    e('div', { className: 'dd-trade-stat-d ' + cls },
                      d === 0 ? '—' : (d > 0 ? '+' : '') + fmt(d)
                    )
                  );
                })
              ),

              // Position breakdown deltas
              e('div', { className: 'dd-trade-posdeltas' },
                ['QB', 'RB', 'WR', 'TE', 'PICKS'].map(pos => {
                  const pre = pos === 'PICKS' ? sim.prePickValue : (base.posValues[pos] || 0);
                  const post = sim.posValues[pos] || 0;
                  const d = post - pre;
                  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'even';
                  return e('div', { key: pos, className: 'dd-trade-posdelta' },
                    e('div', { className: 'pk', style: { color: POS_COLORS[pos]?.hex || '#999' } }, pos),
                    e('div', { className: 'pv' }, fmt(post)),
                    e('div', { className: 'pd ' + cls },
                      d === 0 ? '—' : (d > 0 ? '+' : '') + fmt(d)
                    )
                  );
                })
              )
            );
          })
        )
      );
    })(),

    // Username entry — shown when no user has been looked up yet
    !sleeperUser && !loading && e('div', { className: 'dd-entry-screen' },
      e('h2', null, 'Enter your Sleeper username'),
      e('p', null, 'We\'ll load your leagues so you can pick one to analyze.'),
      e('div', { className: 'dd-entry-row' },
        e('input', {
          className: 'dd-input',
          value: username,
          onChange: ev => setUsername(ev.target.value),
          onKeyDown: ev => ev.key === 'Enter' && loadUser(),
          placeholder: 'Sleeper username',
          autoFocus: true
        }),
        e('button', { className: 'dd-btn', onClick: loadUser, disabled: loading },
          loading ? 'Loading…' : 'Find Leagues')
      )
    ),

    // League picker — shown after username lookup, or when "Change" is clicked
    sleeperUser && (!league || showChangeInput) && !loading && e('div', { className: 'dd-league-picker' },
      e('div', { className: 'dd-league-picker-header' },
        e('h3', null, 'Your Leagues'),
        e('button', { className: 'dd-btn-ghost', onClick: () => {
          if (showChangeInput) { setShowChangeInput(false); }
          else { setSleeperUser(null); setUserLeagues([]); setLeague(null); }
        }}, showChangeInput ? '✕ Cancel' : '← Change user')
      ),
      userLeagues.length === 0
        ? e('p', { style: { color: 'var(--ink-3)', fontSize: '13px' } }, 'No leagues found for this user.')
        : e('div', { className: 'dd-league-grid' },
            userLeagues.map(lg => {
              const sf = lg.roster_positions?.includes('SUPER_FLEX') || lg.roster_positions?.includes('SUPERFLEX');
              const rec = lg.scoring_settings?.rec;
              const scoring = rec === 1 ? 'PPR' : rec === 0.5 ? 'Half-PPR' : 'Std';
              const fmt2 = (sf ? 'SF' : '1QB') + ' · ' + scoring + ' · ' + (lg.total_rosters || '?') + ' teams';
              return e('div', {
                key: lg.league_id,
                className: 'dd-league-card',
                onClick: () => loadLeague(lg.league_id)
              },
                e('div', { className: 'dd-league-card-name' }, lg.name),
                e('div', { className: 'dd-league-card-meta' }, lg.season + ' · ' + fmt2)
              );
            })
          )
    )
  );
}

createRoot(document.getElementById("root")).render(e(DynastyAnalyzer));
</script>
</body>
</html>
