name: Refresh KTC values

on:
  schedule:
    - cron: '17 10 * * *'   # daily, ~4-5am Central
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/fetch-ktc.mjs
      - .github/workflows/ktc.yml

permissions:
  contents: write

concurrency:
  group: ktc-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scrape KeepTradeCut
        run: node scripts/fetch-ktc.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ktc.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh KTC values"
            git push
          fi
